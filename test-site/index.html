<style>
:root{--ink:#1c2e45;--muted:#5a6878;--line:#e7e1d1;--bg:#fbf8f1;--brand:#2f5f99;--brand2:#80a4d6;--soft:#e8f0fa;--gold:#ecdaa2;--gold-d:#9a7a2e;--gold-soft:#faf3df;--red:#c9372c;--red-soft:#fdecea;--amber:#b7791f;--amber-soft:#fbf3e2;--blue:#2b5fa8;--blue-soft:#e8effa;--grey:#f1ece0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,sans-serif}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
h2{font-size:23px;font-family:Fraunces,Georgia,serif;color:var(--ink)}h3{font-size:16px}h4{font-size:14px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:9px 20px;background:#fff;border-bottom:3px solid var(--gold);box-shadow:0 1px 0 var(--line)}
.logo img{height:38px;width:auto;display:block}.logo .ln{display:flex;flex-direction:column;line-height:1.15}.logo .ln b{font-family:Fraunces,Georgia,serif;font-size:17px;color:var(--ink)}.logo .ln span{font-size:12px;font-weight:500;color:var(--brand)}
.logo{display:flex;gap:9px;align-items:center;font-weight:700;font-size:16px}
.sync{margin-left:auto;font-size:12.5px;color:var(--muted)}
.shell{display:flex;min-height:calc(100vh - 55px)}
nav{width:220px;flex:none;background:#fff;border-right:1px solid var(--line);padding:14px 10px}
nav button{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--soft);color:var(--brand);font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
nav .sep{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#98a5a3;padding:14px 11px 5px}
nav .cnt{margin-left:auto;font-size:11.5px;background:var(--grey);border-radius:99px;padding:0 7px}
main{flex:1;min-width:0;padding:24px 28px 70px}
@media(max-width:820px){nav{display:none}main{padding:16px}}
.mnav{display:none}.mpanel{display:none}
@media(max-width:820px){.mnav{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}.mnav button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:13px}.mnav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.mnav .mm{background:#2f5f99;color:#fff;border-color:#2f5f99;font-weight:600}
.mpanel.open{display:block;background:#fff;border-bottom:1px solid var(--line);padding:6px 12px 12px}.mpanel h5{margin:10px 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#777}.mpanel .row{display:flex;flex-wrap:wrap;gap:6px}.mpanel button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px}.mpanel button.on{background:var(--ink);color:#fff}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--muted);max-width:760px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g4,.g3{grid-template-columns:1fr 1fr}}@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpi .l{font-size:12.5px;color:var(--muted)}.kpi .n{font-size:26px;font-weight:700;margin-top:2px}.kpi .s{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#c4cecc}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand2)}
.btn.sm{padding:4px 9px;font-size:12.5px}.btn.ghost{border-color:transparent;background:none}
.btn.ai{background:#f3effc;border-color:#ddd2f7;color:#5b3fa8}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--soft);border-color:var(--brand)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=text]{flex:1;min-width:180px;width:auto}.bar select{width:auto}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}.tog input{accent-color:var(--brand)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#fafcfb}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--grey);color:var(--muted);white-space:nowrap;margin:0 3px 3px 0}
.tag.g{background:var(--soft);color:var(--brand)}.tag.a{background:var(--amber-soft);color:var(--amber)}.tag.r{background:var(--red-soft);color:var(--red)}.tag.b{background:var(--blue-soft);color:var(--blue)}
.pbar{height:7px;background:var(--grey);border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--brand)}
.fit{border-radius:9px;padding:7px 10px;margin:0 0 8px;font-size:13px;line-height:1.4}.fit b{font-size:13.5px}
.fit.now{background:#e7f6ec;color:#14532d;border:1px solid #9fd8b2}.fit.partner{background:#eaf1fb;color:#1e3a66;border:1px solid #b9cdee}.fit.later{background:#f3f1ec;color:#5b5446;border:1px solid #e0d9c8}.fit.no{background:#fbeeee;color:#7a1f1f;border:1px solid #efc4c4}
.opp.fnow{border-left:6px solid #2e9e5b}.opp.fpartner{border-left:6px solid #80a4d6}.opp.flater,.opp.fno{opacity:.86}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}.fchips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;cursor:pointer}.fchips button.on{border-color:var(--ink);background:var(--ink);color:#fff}.fchips .n{opacity:.75;font-weight:500;margin-left:4px}
.ftag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;margin-right:4px}.ftag.now{background:#e7f6ec;color:#14532d}.ftag.partner{background:#eaf1fb;color:#1e3a66}.ftag.later{background:#f3f1ec;color:#5b5446}.ftag.no{background:#fbeeee;color:#7a1f1f}
.opp{display:grid;grid-template-columns:112px 1fr 200px;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px}
@media(max-width:860px){.opp{grid-template-columns:1fr}}
.dl{border-radius:11px;padding:9px;text-align:center;background:var(--grey);font-size:12px}.dl b{display:block;font-size:14px}
.dl.red{background:var(--red-soft);color:var(--red)}.dl.amber{background:var(--amber-soft);color:var(--amber)}.dl.green{background:var(--soft);color:var(--brand)}.dl.blue{background:var(--blue-soft);color:var(--blue)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin-top:8px}.facts dt{color:var(--muted)}.facts dd{margin:0}
.note{font-size:12.5px;color:var(--muted);margin-top:6px}
.gs{margin-top:8px;background:var(--soft);border-radius:9px;padding:7px 11px;font-size:14px}.gs b{font-size:15px}
.how{font-size:12.5px;margin-top:6px}
.uk{font-size:12.5px;margin-top:7px;background:var(--grey);border-radius:8px;padding:5px 9px}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:#eef2f1;border-radius:12px;padding:9px;min-height:110px}
.col h4{font-size:12.5px;margin:2px 4px 9px;display:flex;justify-content:space-between;color:var(--muted)}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:7px;cursor:pointer;font-size:13px}
.kc:hover{border-color:var(--brand)}.kc b{display:block;font-size:13.3px;line-height:1.3}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0}
.tabs2 button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button.on{color:var(--brand);border-color:var(--brand)}
.ms{display:grid;grid-template-columns:24px 1fr 140px 130px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.ms.done .nm{text-decoration:line-through;color:var(--muted)}.ms.late .dt{color:var(--red);font-weight:600}
.ms input[type=checkbox],.chk input{accent-color:var(--brand);width:17px;height:17px}
.chk{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sec{margin-bottom:16px}.sec .sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.wc{font-size:11.5px;color:var(--muted)}
.back{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;margin-bottom:8px}
.agenda .row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.gantt svg{display:block;width:100%;height:auto}
.modal{position:fixed;inset:0;background:rgba(10,25,23,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.on{display:flex}
.box{background:#fff;border-radius:16px;max-width:600px;width:100%;padding:20px;max-height:92vh;overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 15px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:60}.toast.on{opacity:1}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.banner{background:var(--amber-soft);color:#6b4a0c;border-radius:11px;padding:9px 13px;font-size:13px;margin-bottom:14px}
.src{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}
.src h4{margin:6px 0 4px;font-size:14.5px}
.docrow{display:grid;grid-template-columns:1fr 130px 130px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
@media(max-width:860px){.docrow{grid-template-columns:1fr 1fr}.ms{grid-template-columns:24px 1fr}}
.st-ready{color:var(--brand);font-weight:600}.st-update{color:var(--amber);font-weight:600}.st-missing{color:var(--red);font-weight:600}
@media(max-width:600px){#sync{display:none}.logo .ln span{font-size:11px}}
</style>
</head>

// ================= helpers =================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const todayISO=iso(TODAY);
const days=d=>Math.round((new Date(d+'T00:00:00')-TODAY)/864e5);
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return iso(x)};
const fmtD=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtS=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'}):'—';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2300)}
const RATES={GBP:1,EUR:.86,USD:.79,DKK:.115,CHF:.9,SEK:.075,NOK:.073,CAD:.57,AUD:.51,JPY:.0052,CZK:.034};// indicative, GBP per unit
const CURS=Object.keys(RATES);
const gbp=(v,c)=>(+v||0)*(RATES[c]||1);
const money=(v,c='GBP')=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c,maximumFractionDigits:0}).format(+v||0)}catch(e){return c+' '+Math.round(+v||0)}};
const short=v=>v>=1e6?'£'+(v/1e6).toFixed(1)+'M':v>=1e3?'£'+Math.round(v/1e3)+'k':'£'+Math.round(v);

// ================= timeline =================
function events(horizon){const ev=[];
  S.apps.forEach(a=>{if(ACTIVE.includes(a.stage)){(a.milestones||[]).filter(m=>!m.done).forEach(m=>ev.push({date:m.date,what:m.name,app:a,kind:'Milestone'}));if(a.deadline)ev.push({date:a.deadline,what:'DEADLINE',app:a,kind:'Deadline'})}
   (a.reports||[]).filter(r=>!r.done&&r.due).forEach(r=>ev.push({date:r.due,what:r.type,app:a,kind:'Report'}))});
  S.funders.filter(f=>f.nextDate&&!/Committed|Declined/.test(f.stage)).forEach(f=>ev.push({date:f.nextDate,what:f.next||'Follow up',app:{id:'',title:f.name},funder:f,kind:'Funder'}));
  return ev.filter(e=>!horizon||days(e.date)<=horizon).sort((x,y)=>x.date.localeCompare(y.date))}
function gantt(){const apps=S.apps.filter(a=>ACTIVE.includes(a.stage)||(a.stage==='Awarded'&&(a.reports||[]).some(r=>!r.done)));
  if(!apps.length)return`<div class="empty">Nothing on the timeline yet. Start an application from <a href="#" data-act="go" data-v="grants">Find grants</a>.</div>`;
  const start=addDays(todayISO,-7);const allD=apps.flatMap(a=>[a.deadline,...(a.milestones||[]).map(m=>m.date),...(a.reports||[]).map(r=>r.due)]).filter(Boolean);
  let end=allD.sort().pop();if(!end||days(end)<60)end=addDays(todayISO,60);if(days(end)>270)end=addDays(todayISO,270);
  const span=(new Date(end)-new Date(start))/864e5,L=230,W=1000,RH=34,top=30,H=top+apps.length*RH+10;
  const x=d=>L+Math.max(0,Math.min(1,((new Date(d)-new Date(start))/864e5)/span))*(W-L-10);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Application timeline">`;
  for(let d=new Date(start);d<=new Date(end);d.setDate(d.getDate()+1)){if(d.getDate()===1){const X=x(iso(d));s+=`<line x1="${X}" x2="${X}" y1="${top-6}" y2="${H}" stroke="#e3e8e6"/><text x="${X+3}" y="${top-10}" font-size="11" fill="#7a8886">${d.toLocaleDateString(undefined,{month:'short',year:'2-digit'})}</text>`}}
  apps.forEach((a,i)=>{const y=top+i*RH+RH/2;const ms=a.milestones||[];const st=ms.map(m=>m.date).sort()[0]||a.created||todayISO;
   s+=`<text x="4" y="${y+4}" font-size="12" fill="#14211f">${esc(a.title.length>32?a.title.slice(0,31)+'…':a.title)}</text>`;
   if(ACTIVE.includes(a.stage)&&a.deadline){s+=`<rect x="${x(st)}" y="${y-5}" width="${Math.max(2,x(a.deadline)-x(st))}" height="10" rx="5" fill="#cfe7e4"/>`;
    ms.forEach(m=>{s+=`<circle cx="${x(m.date)}" cy="${y}" r="5" fill="${m.done?'#2f5f99':m.date<todayISO?'#c9372c':'#fff'}" stroke="#2f5f99" stroke-width="1.5"><title>${esc(m.name)} · ${fmtD(m.date)}${m.done?' ✓':''}</title></circle>`});
    s+=`<path d="M${x(a.deadline)} ${y-8} l7 8 l-7 8 l-7 -8z" fill="#c9372c"><title>Deadline ${fmtD(a.deadline)}</title></path>`}
   (a.reports||[]).filter(r=>r.due).forEach(r=>{s+=`<rect x="${x(r.due)-5}" y="${y-5}" width="10" height="10" fill="${r.done?'#2f5f99':'#2b5fa8'}" transform="rotate(45 ${x(r.due)} ${y})"><title>${esc(r.type)} · ${fmtD(r.due)}</title></rect>`})});
  const T=x(todayISO);s+=`<line x1="${T}" x2="${T}" y1="${top-6}" y2="${H}" stroke="#c9372c" stroke-dasharray="3 3"/><text x="${T+3}" y="${H-2}" font-size="10.5" fill="#c9372c">today</text></svg>`;
  return`<div class="card gantt">${s}<div class="note" style="margin-top:6px">● milestone (filled = done, red = overdue) · ◆ red = submission deadline · ◆ blue = report due</div></div>`}
function agenda(ev){return ev.length?`<div class="agenda">${ev.map(e=>{const n=days(e.date);return`<div class="row"><b style="color:${n<0?'var(--red)':n<=7?'var(--amber)':'inherit'}">${fmtS(e.date)}</b><div>${e.kind==='Deadline'?'<span class="tag r">Deadline</span>':e.kind==='Report'?'<span class="tag b">Report</span>':e.kind==='Funder'?'<span class="tag g">Funder</span>':''}${esc(e.what)}<div class="note" style="margin:0">${esc(e.app.title)}</div></div>${e.funder?`<button class="btn sm" data-act="editFunder" data-id="${e.funder.id}">Open</button>`:`<button class="btn sm" data-act="openApp" data-id="${e.app.id}">Open</button>`}</div>`}).join('')}</div>`:'<p class="note">Nothing due.</p>'}
function vTimeline(){return`<div class="head"><div><h2>Timeline</h2><p>All active applications and reporting deadlines on one calendar.</p></div></div>${gantt()}
  <div class="card" style="margin-top:14px"><h3>Next 60 days</h3>${agenda(events(60))}</div>`}

 delApp:async()=>{const a=findApp(detail);$('#box').innerHTML=`<h2>Delete this application?</h2><p>${esc(a.title)}. This cannot be undone. To keep a record, set the stage to <b>Withdrawn</b> instead.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="delAppYes">Delete</button></div>`;$('#modal').classList.add('on')},
 delAppYes:async()=>{const id=detail;$('#modal').classList.remove('on');await del('apps',id);go('applications')},
 rebuildMs:()=>{const a=findApp(detail);if(!a.deadline){toast('Set a deadline first');return}a.milestones=MILESTONES.map(([n,off])=>{const old=(a.milestones||[]).find(m=>m.name===n);const dt=addDays(a.deadline,off);return{id:old?old.id:uid(),name:n,date:dt<todayISO?todayISO:dt,done:old?old.done:false,owner:old?old.owner:''}});patchApp(a.id,{milestones:a.milestones});render()},
 addMs:()=>{const a=findApp(detail);a.milestones=[...(a.milestones||[]),{id:uid(),name:'New milestone',date:todayISO,done:false,owner:''}];patchApp(a.id,{milestones:a.milestones});render()},
 addCk:()=>{const v=$('#newCk').value.trim();if(!v)return;const a=findApp(detail);a.checklist=[...(a.checklist||[]),{name:v,done:false}];patchApp(a.id,{checklist:a.checklist});render()},
 rmCk:d=>{const a=findApp(detail);a.checklist.splice(+d.i,1);patchApp(a.id,{checklist:a.checklist});render()},
 addRp:d=>{const a=findApp(detail);a.reports=[...(a.reports||[]),{type:d.t,due:addDays(todayISO,90),done:false}];patchApp(a.id,{reports:a.reports});render()},
 rmRp:d=>{const a=findApp(detail);a.reports.splice(+d.i,1);patchApp(a.id,{reports:a.reports});render()},
 copyProp:()=>{const a=findApp(detail);const txt=`${a.title}\n${a.funder}\n\n`+SECTIONS.map(([k,n])=>`${n.toUpperCase()}\n${(a.sections||{})[k]||''}`).join('\n\n');navigator.clipboard.writeText(txt).then(()=>toast('Proposal copied: paste into the funder template'),()=>toast('Clipboard blocked by the browser'))},
 draft:async(d,btn)=>{const a=findApp(detail),o=findOpp(a.oppId)||{},org=S.settings.org||{},sec=SECTIONS.find(s=>s[0]===d.k);const ta=document.getElementById('sec-'+d.k);
  if(ta.value.trim()&&!confirm_replace(ta))return;
  const others=SECTIONS.filter(s=>s[0]!==d.k&&(a.sections||{})[s[0]]).map(s=>`## ${s[1]}\n${a.sections[s[0]].slice(0,1200)}`).join('\n\n');
  const prompt=`You are an experienced grant writer for a UK-registered medical & humanitarian NGO. Write the "${sec[1]}" section of a grant proposal.
Length & content: ${sec[2]}
Rules: plain text, short paragraphs or numbered points, no markdown headings. Write in the funder's language of results and accountability. NEVER invent statistics, numbers, names or past results: where a figure or fact is needed and not given below, write a placeholder like [insert: maternal mortality rate in district, source]. Align with humanitarian principles, Core Humanitarian Standard and safeguarding good practice.

FUNDER & CALL
Funder: ${a.funder}
Call: ${a.title}
Funder notes: ${[o.eligibility,o.where,o.amount,o.notes].filter(Boolean).join(' | ')}
Amount requested: ${a.amount?a.amount+' '+a.currency:'not set'}

ORGANISATION
${JSON.stringify(org)}

PROJECT BRIEF
${JSON.stringify(a.project||{})}

OTHER SECTIONS ALREADY WRITTEN (for consistency)
${others||'none yet'}

Now write only the "${sec[1]}" section.`;
  btn.disabled=true;btn.textContent='Writing…';
  try{const r=await sample(prompt,{modelTier:'default',cache:false,onText:({text})=>{ta.value=text}});ta.value=r.text;a.sections={...(a.sections||{}),[d.k]:r.text};patchApp(a.id,{sections:a.sections});toast('Draft ready: review and edit it')}
  catch(e){toast(e&&e.code==='rate_limited'?'Too many requests, try again in a minute':e&&e.code==='not_granted'?'AI drafting not allowed in this view':'Drafting failed')}
  btn.disabled=false;btn.textContent='✨ Draft with Claude'},
 chkList:()=>{sub.g=Object.assign(sub.g||{q:'',type:'',theme:'',uk:false,st:'live',fc:'',sz:'',wc:'',rg:'',mode:'list'},{tr:'chk'});go('grants')},
 dlCSV:async d=>{try{await dls.save({filename:d.n,data:'\ufeff'+$('#csvTxt').value});toast('Saved '+d.n)}catch(e){toast('Download cancelled or blocked: use Copy instead')}},
 cpCSV:()=>{const t=$('#csvTxt');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Copied'),()=>{try{document.execCommand('copy');toast('Copied')}catch(e){toast('Select the text and copy it')}})},
 fbAgain:()=>{sub.fb={};render()},
 mtoggle:()=>{$('#mpanel').classList.toggle('open')},
 ftset:d=>{sub.g=Object.assign(sub.g||{q:'',type:'',theme:'',uk:false,st:'live',fc:'',sz:'',wc:'',rg:'',tr:'',mode:'list'},{ft:d.f||''});go('grants')},
 reviewOpp:async d=>{const o=findOpp(d.id);if(!o)return;await put('opps',o.id,{...o,review:false,reviewed:todayISO,checked:todayISO});render();toast('Marked as checked')},
 addOpp:()=>{$('#box').innerHTML=`<h2>Add a grant you found</h2><label class="f">Title</label><input type="text" id="oT"><label class="f">Funder</label><input type="text" id="oF">
  <div class="grid g2" style="gap:8px"><div><label class="f">Deadline (blank = rolling)</label><input type="date" id="oD"></div><div><label class="f">Funder type</label><select id="oY">${['Government','EU','UN / multilateral','Pooled fund','Foundation','Research fund','Corporate'].map(x=>`<option>${x}</option>`).join('')}</select></div>
  <div><label class="f">Funder country</label><select id="oC">${Object.keys(FLAGS).sort().map(c=>`<option>${c}</option>`).join('')}<option>Other</option></select></div><div><label class="f">Max grant (number)</label><input type="number" id="oX" min="0"></div><div><label class="f">Currency</label><select id="oCu">${Object.keys(RATES).map(c=>`<option>${c}</option>`).join('')}</select></div><div><label class="f">Amount notes</label><input type="text" id="oA" placeholder="e.g. per year, up to 3 years"></div><div><label class="f">UK charity eligibility</label><select id="oU"><option value="direct">Apply directly</option><option value="partner">Via a partner</option><option value="check">Check</option><option value="no">Not eligible</option></select></div></div>
  <label class="f">Where</label><input type="text" id="oW"><label class="f">Who can apply</label><input type="text" id="oE"><label class="f">Themes (comma-separated)</label><input type="text" id="oG" placeholder="Health, Humanitarian"><label class="f">Link to the funder's own call page</label><input type="url" id="oL" placeholder="https://"><p class="note">Use the funder's official page, not a listing site. Never pay a fee to apply.</p>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="saveOpp">Add</button></div>`;$('#modal').classList.add('on')},
 saveOpp:async()=>{const t=$('#oT').value.trim(),u=$('#oL').value.trim();if(!t||!/^https?:\/\//.test(u)){toast('Add a title and a link starting with https://');return}
  const id='m'+uid(),dl=$('#oD').value;const mx=+$('#oX').value||null;await put('opps',id,{title:t,funder:$('#oF').value.trim(),fc:$('#oC').value,amax:mx,acur:$('#oCu').value,aNote:$('#oA').value.trim()||(mx?'maximum per grant':'Not published'),type:$('#oY').value,deadline:dl,status:dl?'open':'rolling',amount:$('#oA').value.trim(),where:$('#oW').value.trim(),eligibility:$('#oE').value.trim(),focus:$('#oG').value.split(',').map(s=>s.trim()).filter(Boolean),intl:true,uk:$('#oU').value,url:u,source:'Added by team',checked:todayISO,added:todayISO});$('#modal').classList.remove('on');render();toast('Added for your team')},
 addFl:()=>{const F={...(S.settings.fin||{})};F.lines=[...(F.lines||[]),{name:'New income line',type:INCOME_TYPES[0],amount:'',restricted:false}];S.settings.fin=F;put('settings','fin',F);render()},
 rmFl:d=>{const F={...(S.settings.fin||{})};F.lines=(F.lines||[]).filter((_,i)=>i!==+d.i);S.settings.fin=F;put('settings','fin',F);render()},
 supTab:d=>{go(d.t==='sources'?'medsources':d.t==='quality'?'medquality':'supplies')},
 trackFunder:async d=>{const id='f'+uid();await put('funders',id,{name:d.n,type:/Trust/.test(d.t)?'Trust':d.t,stage:'Identified',url:d.u,currency:'GBP',created:todayISO});render();toast('Added to Funder relationships')},
 newFunder:()=>funderForm(),editFunder:d=>funderForm(S.funders.find(f=>f.id===d.id)),
 saveFunder:async d=>{const name=$('#fN').value.trim();if(!name){toast('Add the funder name');return}const id=d.id||'f'+uid();const old=S.funders.find(f=>f.id===id)||{created:todayISO};
  await put('funders',id,{...old,name,type:$('#fT').value,stage:$('#fS').value,contact:$('#fC').value.trim(),email:$('#fE').value.trim(),ask:$('#fA').value,currency:$('#fCu').value,owner:$('#fO').value.trim(),next:$('#fX').value.trim(),nextDate:$('#fD').value,last:$('#fL').value,url:$('#fU').value.trim(),notes:$('#fNo').value,updated:todayISO});$('#modal').classList.remove('on');render();toast('Saved')},
 delFunder:async d=>{await del('funders',d.id);$('#modal').classList.remove('on');render()},
 addSup:()=>supForm(),editSup:d=>supForm(S.supplies.find(s=>s.id===d.id)),
 saveSup:async d=>{const item=$('#sI').value.trim();if(!item){toast('Name the item');return}const id=d.id||'s'+uid();const old=S.supplies.find(s=>s.id===id)||{};
  await put('supplies',id,{...old,item,cat:$('#sC').value,spec:$('#sSp').value.trim(),qty:$('#sQ').value.trim(),unit:$('#sU').value.trim(),project:$('#sP').value.trim(),needBy:$('#sN').value,source:$('#sS').value.trim(),appId:$('#sA').value,cost:$('#sCo').value,currency:$('#sCu').value,expiry:$('#sE').value,status:$('#sSt').value,updated:todayISO});$('#modal').classList.remove('on');render();toast('Saved')},
 delSup:async d=>{await del('supplies',d.id);$('#modal').classList.remove('on');render()},
 csv:()=>{const R=S.apps;const h=['title','funder','stage','deadline','submitted','amount','currency','awarded','decision_date','grant_start','grant_end','reference','owner'];
  const csv=[h.join(',')].concat(R.map(a=>[a.title,a.funder,a.stage,a.deadline,a.submitted,a.amount,a.currency,a.awarded,a.decisionDate,a.start,a.end,a.ref,a.owner].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))).join('\n');
  showCSV(csv,'applications.csv',R.length+' applications')},
 csvOpps:()=>{const h=['title','funder','funder_country','type','where','uk_eligibility','min','max','currency','amount_note','deadline','status','apply_link','call_page','checked','verified'];
  const rows=S.opps.filter(o=>state(o)!=='closed').map(o=>[o.title,o.funder,o.fc,o.type,o.where,o.uk,o.amin,o.amax,o.acur,o.aNote,o.deadline,state(o),o.applyUrl||o.url,o.url,o.checked,o.verified]);
  showCSV([h.join(',')].concat(rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))).join('\n'),'grant-opportunities.csv',rows.length+' live opportunities')}
};
function confirm_replace(ta){return ta.dataset.ok==='1'||(ta.dataset.ok='1',toast('This section has text: click Draft again to replace it'),false)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='A'||el.dataset.act==='go')e.preventDefault();const fn=ACT[el.dataset.act];if(fn)fn(el.dataset,el,e)});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')});

// field bindings
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.gf==='q'||t.dataset.gf==='wc'){sub.g[t.dataset.gf]=t.value;clearTimeout(t._h);t._h=setTimeout(render,300)}
  if(t.dataset.sec){const a=findApp(detail);a.sections={...(a.sections||{}),[t.dataset.sec]:t.value};patchApp(a.id,{sections:a.sections},true)}
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.gf&&d.gf!=='q'&&d.gf!=='wc'){sub.g[d.gf]=t.type==='checkbox'?t.checked:t.value;render();return}
  if(d.ff){sub.f[d.ff]=t.value;render();return}
  if(d.fin){const F={...(S.settings.fin||{}),[d.fin]:t.value};S.settings.fin=F;put('settings','fin',F).then(()=>toast('Saved'));render();return}
  if(d.fl!==undefined){const F={...(S.settings.fin||{})};F.lines=[...(F.lines||[])];F.lines[+d.fl]={...F.lines[+d.fl],[d.k]:t.type==='checkbox'?t.checked:t.value};S.settings.fin=F;put('settings','fin',F).then(()=>toast('Saved'));render();return}
  if(d.cmp!==undefined){const c={...(S.settings.compliance||{}),[d.cmp]:t.checked};S.settings.compliance=c;put('settings','compliance',c);render();return}
  if(d.sust!==undefined){const c={...(S.settings.sust||{}),[d.sust]:t.checked};S.settings.sust=c;put('settings','sust',c);return}
  if(d.cl!==undefined){sub.cost.lines[d.cl]=+t.value||0;render();return}
  if(d.cr){if(d.cr==='rule'){sub.cost.rule=+t.value;sub.cost.pct=COST_RULES[+t.value][1]}else sub.cost[d.cr]=+t.value||0;render();return}
  if(d.af){const a=findApp(detail);let v=t.value;const p={[d.af]:v};if(d.af==='stage'&&v==='Submitted'&&!a.submitted)p.submitted=todayISO;if(d.af==='stage'&&v==='Awarded'&&!a.decisionDate)p.decisionDate=todayISO;patchApp(a.id,p);if(['stage','deadline','title'].includes(d.af))render();return}
  if(d.pf){const a=findApp(detail);a.project={...(a.project||{}),[d.pf]:t.value};patchApp(a.id,{project:a.project});return}
  if(d.ms){const a=findApp(detail);const m=a.milestones.find(x=>x.id===d.ms);m[d.k]=t.type==='checkbox'?t.checked:t.value;patchApp(a.id,{milestones:a.milestones});if(d.k!=='owner'&&d.k!=='name')render();return}
  if(d.ck!==undefined){const a=findApp(detail);a.checklist[+d.ck].done=t.checked;patchApp(a.id,{checklist:a.checklist});return}
  if(d.rp!==undefined){const a=findApp(detail);a.reports[+d.rp][d.k]=t.type==='checkbox'?t.checked:t.value;patchApp(a.id,{reports:a.reports});render();return}
  if(d.org){const o={...(S.settings.org||{}),[d.org]:t.value};put('settings','org',o).then(()=>toast('Saved'));S.settings.org=o;if(d.org==='name')render();return}
  if(d.doc){const cur={...(S.docs[d.doc]||{}),[d.k]:t.value};put('docs',d.doc,cur).then(()=>toast('Saved'));if(d.k!=='link')render();return}
  if(d.sup){const s=S.supplies.find(x=>x.id===d.sup);put('supplies',s.id,{...s,[d.k]:t.value,updated:todayISO}).then(()=>{toast('Saved');render()});return}
  if(d.supck!==undefined){const c={...(S.settings.supcheck||{}),[d.supck]:t.checked};S.settings.supcheck=c;put('settings','supcheck',c);return}
});

// ================= boot =================
sub.g={q:'',type:'',theme:'',uk:false,st:'live',fc:'',sz:'',wc:'',rg:'',tr:'',ft:'',mode:'list'};
{const h=(location.hash||'').slice(1);if(VIEWS.some(v=>v[0]===h))view=h}
loadLocal();render();$('#sync').textContent='Test version · saved in this browser';
(async()=>{try{const c=window.claude;if(!c||!c.use)return;
  db=await c.use('db');
  try{sample=await c.use('sample')}catch(e){sample=null}
  try{dls=await c.use('downloads')}catch(e){dls=null}
  if(!db){$('#sync').textContent='Sign in on claude.ai to share data with your team';render();return}
  S.apps=[];S.docs={};S.supplies=[];S.settings={};S.opps=[];S.funders=[];
  const sub1=(col,fn)=>db.collection(col).onSnapshot(s=>{fn(s);$('#sync').textContent='● Live: shared with your team';softRender()},()=>{$('#sync').textContent='Connection problem: retrying'});
  sub1('opps',s=>{S.opps=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub1('apps',s=>{S.apps=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data())),...(PEND[d.id]||{})}))});
  sub1('docs',s=>{S.docs={};s.docs.forEach(d=>S.docs[d.id]=d.data())});
  sub1('funders',s=>{S.funders=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub1('supplies',s=>{S.supplies=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub1('settings',s=>{S.settings={};s.docs.forEach(d=>S.settings[d.id]=d.data())});
  render();
}catch(e){$('#sync').textContent='Test version · saved in this browser'}})();
</script>
