 grants suit a new charity. Check whether the embassy for your country accepts international NGOs.":"✅ ⟦A⟧يمكن لمؤسسة الرسالة التقديم الآن⟦/A⟧ · منح السفارات الصغيرة تناسب جمعية جديدة. تحققوا مما إذا كانت السفارة في بلدكم تقبل المنظمات الدولية.","✅ ⟦A⟧Al Risaleh can apply now⟦/A⟧ · Small innovation calls are open to humanitarian NGOs, including new ones.":"✅ ⟦A⟧يمكن لمؤسسة الرسالة التقديم الآن⟦/A⟧ · دعوات الابتكار الصغيرة متاحة للمنظمات الإنسانية، بما فيها الجديدة.","✅ ⟦A⟧Al Risaleh can apply now⟦/A⟧ · Start now: UN Partner Portal registration and capacity assessment in each country.":"✅ ⟦A⟧يمكن لمؤسسة الرسالة التقديم الآن⟦/A⟧ · ابدؤوا الآن: التسجيل في بوابة شركاء الأمم المتحدة وتقييم القدرات في كل بلد.","✅ ⟦A⟧Al Risaleh can apply now⟦/A⟧ · Start now: register and get assessed; apply jointly with a Yemeni partner.":"✅ ⟦A⟧يمكن لمؤسسة الرسالة التقديم الآن⟦/A⟧ · ابدؤوا الآن: سجّلوا واحصلوا على التقييم؛ وقدّموا بالاشتراك مع شريك يمني.","✅ ⟦A⟧Al Risaleh can apply now⟦/A⟧ · Start now: register and get the capacity assessment for Syria.":"✅ ⟦A⟧يمكن لمؤسسة الرسالة التقديم الآن⟦/A⟧ · ابدؤوا الآن: سجّلوا واحصلوا على تقييم القدرات لسوريا.","✅ ⟦A⟧Al Risaleh can apply now⟦/A⟧ · Start now: register and get the capacity assessment; health and trauma are priorities.":"✅ ⟦A⟧يمكن لمؤسسة الرسالة التقديم الآن⟦/A⟧ · ابدؤوا الآن: سجّلوا واحصلوا على تقييم القدرات؛ الصحة والإصابات أولوية.","✅ ⟦A⟧Al Risaleh can apply now⟦/A⟧ · Start now: register on the UN Partner Portal and request the capacity assessment. Funding follows once you're assessed and active in Lebanon.":"✅ ⟦A⟧يمكن لمؤسسة الرسالة التقديم الآن⟦/A⟧ · ابدؤوا الآن: سجّلوا في بوابة شركاء الأمم المتحدة واطلبوا تقييم القدرات. يأتي التمويل بعد تقييمكم ونشاطكم في لبنان.","✅ ⟦A⟧Al Risaleh can apply now⟦/A⟧ · You can approach now with a concept note; country offices in Gaza and Türkiye/Syria.":"✅ ⟦A⟧يمكن لمؤسسة الرسالة التقديم الآن⟦/A⟧ · يمكنكم التواصل الآن بمذكرة مفاهيمية؛ مكاتب قُطرية في غزة وتركيا/سوريا.","✅ ⟦A⟧Al Risaleh can apply now⟦/A⟧ · You can propose a joint health project now.":"✅ ⟦A⟧يمكن لمؤسسة الرسالة التقديم الآن⟦/A⟧ · يمكنكم اقتراح مشروع صحي مشترك الآن.","✅ ⟦A⟧Al Risaleh can apply now⟦/A⟧ · You can send a concept note now; has funded small Gaza health projects.":"✅ ⟦A⟧يمكن لمؤسسة الرسالة التقديم الآن⟦/A⟧ · يمكنكم إرسال مذكرة مفاهيمية الآن؛ وقد موّلت مشاريع صحية صغيرة في غزة.","✅ ⟦A⟧Al Risaleh can apply now⟦/A⟧ · You can send a concept note now; pair with a local partner in the region.":"✅ ⟦A⟧يمكن لمؤسسة الرسالة التقديم الآن⟦/A⟧ · يمكنكم إرسال مذكرة مفاهيمية الآن؛ مع شريك محلي في المنطقة.","✉ Create follow-ups for guests & sponsors":"✉ إنشاء متابعات للضيوف والرعاة","✔ Checked against official sources {d}":"✔ تم التحقق من المصادر الرسمية {d}","✔ Confirmed only":"✔ المؤكدة فقط","✕ Stop tracking":"✕ إيقاف المتابعة","✕ Untrack":"✕ إلغاء المتابعة","✖ Not a fit (UK-only)":"✖ غير مناسبة (المملكة المتحدة فقط)","✖ Not eligible⟦A⟧{n}⟦/A⟧":"✖ غير مؤهل⟦A⟧{n}⟦/A⟧","✖ ⟦A⟧Not eligible for a UK charity⟦/A⟧ · Danish-registered organisations only.":"✖ ⟦A⟧غير مؤهلة لجمعية بريطانية⟦/A⟧ · للمنظمات المسجلة في الدنمارك فقط.","✖ ⟦A⟧Not eligible for a UK charity⟦/A⟧ · EU-registered NGOs only. Possible later through an EU sister organisation.":"✖ ⟦A⟧غير مؤهلة لجمعية بريطانية⟦/A⟧ · للمنظمات المسجلة في الاتحاد الأوروبي فقط. ممكنة لاحقًا عبر منظمة شقيقة أوروبية.","✖ ⟦A⟧Not eligible for a UK charity⟦/A⟧ · UK organisations can't receive EU{n}Health funding.":"✖ ⟦A⟧غير مؤهلة لجمعية بريطانية⟦/A⟧ · لا يمكن للمنظمات البريطانية تلقي تمويل EU{n}Health.","⟦A⟧A Jordanian partner.⟦/A⟧ Run the home with a Jordanian-registered organisation under an MoU. Jordanian associations need government approval to receive foreign funding, which can take weeks or months, so start early. Organisations already supporting evacuee families include the King Hussein Cancer Foundation, Anera with the Jordan River Foundation, and Save the Children Jordan.":"⟦A⟧شريك أردني.⟦/A⟧ أديروا البيت مع منظمة مسجلة في الأردن بموجب مذكرة تفاهم. تحتاج الجمعيات الأردنية إلى موافقة حكومية لتلقي التمويل الأجنبي، وقد يستغرق ذلك أسابيع أو أشهرًا، فابدؤوا مبكرًا. من المنظمات التي تدعم أسر المُجلين بالفعل: مؤسسة الحسين للسرطان، وAnera مع مؤسسة نهر الأردن، وSave the Children الأردن.","⟦A⟧A restricted fund.⟦/A⟧ Money given for the home can only be spent on the home. Say in the appeal what happens to any surplus, and keep Zakat separate (⟦B⟧Code of Fundraising Practice⟦/B⟧).":"⟦A⟧صندوق مقيّد.⟦/A⟧ الأموال المتبرَّع بها للبيت لا تُنفق إلا على البيت. وضّحوا في الحملة ما يحدث لأي فائض، وافصلوا الزكاة (⟦B⟧مدونة ممارسات جمع التبرعات⟦/B⟧).","⟦A⟧After {n}st audited accounts:⟦/A⟧ approach FCDO, Start Network membership, Irish Aid. ⟦B⟧After {n} years:⟦/B⟧ UK Aid Match. ⟦C⟧After {n} years:⟦/C⟧ Hilton Prize.":"⟦A⟧بعد أول حسابات مدققة ({n}):⟦/A⟧ تواصلوا مع FCDO وعضوية Start Network وIrish Aid. ⟦B⟧بعد {n} سنوات:⟦/B⟧ UK Aid Match. ⟦C⟧بعد {n} سنوات:⟦/C⟧ جائزة Hilton.","⟦A⟧Approach:⟦/A⟧ Ask for SIM cards and data for families, an SMS donation channel, and sponsorship of the playroom.":"⟦A⟧طريقة التواصل:⟦/A⟧ اطلبوا شرائح اتصال وبيانات للأسر، وقناة تبرع عبر الرسائل القصيرة، ورعاية غرفة اللعب.","⟦A⟧Approach:⟦/A⟧ Ask for in-kind medicines for families at the home and a named sponsorship (e.g. the family kitchen or a room).":"⟦A⟧طريقة التواصل:⟦/A⟧ اطلبوا أدوية عينية للأسر في البيت ورعاية باسم الشركة (مثل المطبخ العائلي أو غرفة).","⟦A⟧Approach:⟦/A⟧ Choose Love funds partner organisations: ask how to become a partner for evacuee family support.":"⟦A⟧طريقة التواصل:⟦/A⟧ تموّل Choose Love منظمات شريكة: اسألوا كيف تصبحون شريكًا في دعم أسر المُجلين.","⟦A⟧Approach:⟦/A⟧ Doctors’ associations are natural hosts: offer the family home as their gala cause, or sponsor a table.":"⟦A⟧طريقة التواصل:⟦/A⟧ جمعيات الأطباء مستضيفون طبيعيون: اقترحوا البيت العائلي قضيةً لحفلهم، أو ارعوا طاولة.","⟦A⟧Approach:⟦/A⟧ Fit for the schooling part of the family home (children missing school during treatment).":"⟦A⟧طريقة التواصل:⟦/A⟧ مناسب للجانب التعليمي في البيت العائلي (أطفال يفوتهم التعليم أثناء العلاج).","⟦A⟧Approach:⟦/A⟧ Funds concrete, countable child-health outcomes. Pitch a clear cost per family housed and the number of children helped.":"⟦A⟧طريقة التواصل:⟦/A⟧ تموّل نتائج ملموسة وقابلة للعدّ في صحة الأطفال. اعرضوا تكلفة واضحة لكل أسرة يتم إسكانها وعدد الأطفال المستفيدين.","⟦A⟧Approach:⟦/A⟧ Health-worker network: approach for medical volunteers, speakers and a joint event; learn from their gala format.":"⟦A⟧طريقة التواصل:⟦/A⟧ شبكة للعاملين الصحيين: تواصلوا معهم لمتطوعين طبيين ومتحدثين وفعالية مشتركة؛ وتعلموا من صيغة حفلهم.","⟦A⟧Approach:⟦/A⟧ Institutional; best reached through a joint project with WHO or a UN agency. Use it as a reference donor in proposals.":"⟦A⟧طريقة التواصل:⟦/A⟧ جهة مؤسسية؛ أفضل وصول إليها عبر مشروع مشترك مع منظمة الصحة العالمية أو وكالة أممية. استخدموها كمانح مرجعي في المقترحات.","⟦A⟧Approach:⟦/A⟧ Model for your own Ramadan {n} iftar: three-course dinner, speakers, Quran recitation and a live appeal.":"⟦A⟧طريقة التواصل:⟦/A⟧ نموذج لإفطاركم في رمضان {n}: عشاء من ثلاثة أطباق، متحدثون، تلاوة قرآن ونداء تبرع مباشر.","⟦A⟧Approach:⟦/A⟧ Model to copy: ask banks and companies with offices in Amman or London to match their staff’s giving.":"⟦A⟧طريقة التواصل:⟦/A⟧ نموذج يُحتذى: اطلبوا من البنوك والشركات التي لها مكاتب في عمّان أو لندن مضاعفة تبرعات موظفيها.","⟦A⟧Approach:⟦/A⟧ Mostly funds civil-society partners and capacity. Approach with your Jordanian partner, focused on the families’ psychosocial and education needs.":"⟦A⟧طريقة التواصل:⟦/A⟧ تموّل غالبًا شركاء المجتمع المدني وبناء القدرات. تواصلوا مع شريككم الأردني، مع التركيز على الاحتياجات النفسية الاجتماعية والتعليمية للأسر.","⟦A⟧Approach:⟦/A⟧ Present the home at a chamber meeting; ask members for furniture, food and room sponsorships.":"⟦A⟧طريقة التواصل:⟦/A⟧ اعرضوا البيت في اجتماع للغرفة التجارية؛ واطلبوا من الأعضاء الأثاث والطعام ورعاية الغرف.","⟦A⟧Approach:⟦/A⟧ Send an Arabic + English concept note on families of sick children; offer Zakat-eligible budget lines and clear visibility.":"⟦A⟧طريقة التواصل:⟦/A⟧ أرسلوا مذكرة مفاهيمية بالعربية والإنجليزية عن أسر الأطفال المرضى؛ واعرضوا بنود ميزانية مؤهلة للزكاة وظهورًا واضحًا.","⟦A⟧Approach:⟦/A⟧ Similar ask to Zain: connectivity for families plus a named sponsorship.":"⟦A⟧طريقة التواصل:⟦/A⟧ طلب مشابه لزين: الاتصال للأسر إضافة إلى رعاية باسم الشركة.","⟦A⟧Before you approach anyone:⟦/A⟧ check their current giving priorities, do your ⟦B⟧due-diligence checks⟦/B⟧ (and your organisation policy), and use introductions where you can. Large Gulf givers mostly fund through UN agencies or established partners, so lead with a partnership, not a cold ask. Record contact consent before emailing.":"⟦A⟧قبل التواصل مع أي جهة:⟦/A⟧ تحققوا من أولويات عطائها الحالية، وأجروا ⟦B⟧فحوصات العناية الواجبة⟦/B⟧ (وفق سياسة منظمتكم)، واستعينوا بالتعريف الشخصي حيث أمكن. يموّل كبار المانحين الخليجيين غالبًا عبر وكالات الأمم المتحدة أو شركاء راسخين، فابدؤوا بشراكة لا بطلب مباشر. سجّلوا موافقة التواصل قبل المراسلة.","⟦A⟧Biggest moments:⟦/A⟧ Ramadan (expected from {d}) and the first ten days of Dhul Hijjah (expected {n}–{d}). See ⟦B⟧Zakat, Sadaqah & Waqf⟦/B⟧ for the calendar. Raffles are lotteries in UK law: follow ⟦C⟧the rules⟦/C⟧.":"⟦A⟧أهم المواسم:⟦/A⟧ رمضان (متوقع من {d}) والعشر الأوائل من ذي الحجة (متوقعة {n}–{d}). انظروا ⟦B⟧الزكاة والصدقة والوقف⟦/B⟧ للتقويم. السحوبات تُعدّ يانصيبًا في القانون البريطاني: اتبعوا ⟦C⟧القواعد⟦/C⟧.","⟦A⟧Design for the families:⟦/A⟧ safeguarding and child protection, wheelchair access for amputees, infection control for children on chemotherapy, a halal kitchen for special diets, a prayer room, a playroom and space for schooling and psychosocial support.":"⟦A⟧صمّموا للأسر:⟦/A⟧ الحماية وحماية الطفل، الوصول بالكراسي المتحركة لمبتوري الأطراف، مكافحة العدوى للأطفال الخاضعين للعلاج الكيميائي، مطبخ حلال للأنظمة الغذائية الخاصة، غرفة صلاة، غرفة لعب ومساحة للتعليم والدعم النفسي الاجتماعي.","⟦A⟧Expected⟦/A⟧next round":"⟦A⟧متوقعة⟦/A⟧الجولة التالية","⟦A⟧For Al Risaleh:⟦/A⟧ Hold in a separate, interest-free Zakat fund and spend only on eligible projects.":"⟦A⟧لمؤسسة الرسالة:⟦/A⟧ احتفظوا بها في صندوق زكاة منفصل بلا فوائد، ولا تصرفوها إلا على المشاريع المؤهلة.","⟦A⟧For Al Risaleh:⟦/A⟧ Name projects clearly and report on them for years.":"⟦A⟧لمؤسسة الرسالة:⟦/A⟧ سمّوا المشاريع بوضوح وقدّموا عنها تقارير لسنوات.","⟦A⟧For Al Risaleh:⟦/A⟧ Needs trustee approval, a written waqf deed and an investment policy (Shariah-compliant).":"⟦A⟧لمؤسسة الرسالة:⟦/A⟧ يحتاج إلى موافقة الأمناء، ووثيقة وقف مكتوبة، وسياسة استثمار (متوافقة مع الشريعة).","⟦A⟧For Al Risaleh:⟦/A⟧ Only offer if you can deliver food to people in need.":"⟦A⟧لمؤسسة الرسالة:⟦/A⟧ لا تقدّموه إلا إذا كنتم قادرين على إيصال الطعام للمحتاجين.","⟦A⟧For Al Risaleh:⟦/A⟧ The most flexible Islamic gift: ideal for core costs.":"⟦A⟧لمؤسسة الرسالة:⟦/A⟧ أكثر أنواع العطاء الإسلامي مرونة: مثالي للتكاليف الأساسية.","⟦A⟧For Al Risaleh:⟦/A⟧ Treat like general Sadaqah.":"⟦A⟧لمؤسسة الرسالة:⟦/A⟧ يُعامل كالصدقة العامة.","⟦A⟧For a UK charity:⟦/A⟧ A UK charity can only apply if invited, or through an Irish-registered entity/partner. Worth contacting Irish Aid's Civil Society Unit before the next round.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ لا يمكن لجمعية بريطانية التقديم إلا بدعوة، أو عبر كيان/شريك مسجل في أيرلندا. يستحق التواصل مع وحدة المجتمع المدني في Irish Aid قبل الجولة التالية.","⟦A⟧For a UK charity:⟦/A⟧ Aimed at Sudanese civil society. Apply through a local Sudanese partner organisation.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ موجهة للمجتمع المدني السوداني. قدّموا عبر منظمة شريكة سودانية محلية.","⟦A⟧For a UK charity:⟦/A⟧ Aimed at locally registered organisations. Support your Lebanese partner to apply.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ موجهة للمنظمات المسجلة محليًا. ادعموا شريككم اللبناني للتقديم.","⟦A⟧For a UK charity:⟦/A⟧ Any NGO can be selected as a sub-recipient through the country's Country Coordinating Mechanism.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ يمكن اختيار أي منظمة كمستفيد فرعي عبر آلية التنسيق القطرية في البلد.","⟦A⟧For a UK charity:⟦/A⟧ Any NGO operating in the country can apply once it passes OCHA's capacity assessment.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ يمكن لأي منظمة عاملة في البلد التقديم بعد اجتياز تقييم القدرات من OCHA.","⟦A⟧For a UK charity:⟦/A⟧ Apply through the Japanese embassy in each country where you are registered. Best fit: medical equipment and facility upgrades for health centres.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ قدّموا عبر السفارة اليابانية في كل بلد تكونون مسجلين فيه. الأنسب: المعدات الطبية وتطوير مرافق المراكز الصحية.","⟦A⟧For a UK charity:⟦/A⟧ Ask a UK Rotary club to sponsor your project with a club in Lebanon, Iraq, Jordan or Palestine.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ اطلبوا من نادي روتاري بريطاني رعاية مشروعكم مع نادٍ في لبنان أو العراق أو الأردن أو فلسطين.","⟦A⟧For a UK charity:⟦/A⟧ Become a Start Network member (it is UK-based and open to international NGOs). Then you can respond to crisis alerts.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ كونوا عضوًا في Start Network (مقرها المملكة المتحدة ومفتوحة للمنظمات الدولية). عندها يمكنكم الاستجابة لتنبيهات الأزمات.","⟦A⟧For a UK charity:⟦/A⟧ Built for UK charities like Al Risaleh. Prefers projects with a Christian ethos but also funds others.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ مصممة لجمعيات بريطانية مثل مؤسسة الرسالة. تفضّل المشاريع ذات الطابع المسيحي لكنها تموّل غيرها أيضًا.","⟦A⟧For a UK charity:⟦/A⟧ Built for UK charities. FCDO matches {n} for every {n} the UK public gives to your appeal (minimum {n} raised).":"⟦A⟧لجمعية بريطانية:⟦/A⟧ مصممة للجمعيات البريطانية. تطابق FCDO {n} مقابل كل {n} يتبرع به الجمهور البريطاني لحملتكم (بحد أدنى {n}).","⟦A⟧For a UK charity:⟦/A⟧ Check whether foreign NGOs can apply directly or through a local partner.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تحققوا مما إذا كان بإمكان المنظمات الأجنبية التقديم مباشرة أو عبر شريك محلي.","⟦A⟧For a UK charity:⟦/A⟧ Countries apply through their governments. Get included in national proposals through the Ministry of Health or the implementing entity.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تتقدم الدول عبر حكوماتها. احرصوا على إدراجكم في المقترحات الوطنية عبر وزارة الصحة أو الجهة المنفذة.","⟦A⟧For a UK charity:⟦/A⟧ Czech national funding. Go in as a partner of a Czech NGO.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تمويل وطني تشيكي. ادخلوا كشريك لمنظمة تشيكية.","⟦A⟧For a UK charity:⟦/A⟧ Danish-registered organisations only.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ للمنظمات المسجلة في الدنمارك فقط.","⟦A⟧For a UK charity:⟦/A⟧ Designed for local organisations. Support your local partner to apply.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ مصممة للمنظمات المحلية. ادعموا شريككم المحلي للتقديم.","⟦A⟧For a UK charity:⟦/A⟧ Eligible if you are registered and operating in Afghanistan. Otherwise, go in through an Afghan-registered partner.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ مؤهلة إذا كنتم مسجلين وعاملين في أفغانستان. وإلا فادخلوا عبر شريك مسجل في أفغانستان.","⟦A⟧For a UK charity:⟦/A⟧ Ethiopia is a Least Developed Country, where UK NGOs can normally lead EU external-aid grants. Confirm the nationality rule in the call guidelines.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ إثيوبيا من الدول الأقل نموًا، حيث يمكن عادة للمنظمات البريطانية قيادة منح المساعدات الخارجية الأوروبية. تأكدوا من قاعدة الجنسية في إرشادات الدعوة.","⟦A⟧For a UK charity:⟦/A⟧ For Jordanian-registered organisations. Apply through a Jordanian partner (e.g. the organisation that will run the Gaza family home).":"⟦A⟧لجمعية بريطانية:⟦/A⟧ للمنظمات المسجلة في الأردن. قدّموا عبر شريك أردني (مثل المنظمة التي ستدير بيت أسر غزة).","⟦A⟧For a UK charity:⟦/A⟧ For UK charities. Projects must have an educational element; medical supplies can be funded if they enable education or training (e.g. health-worker training).":"⟦A⟧لجمعية بريطانية:⟦/A⟧ للجمعيات البريطانية. يجب أن يتضمن المشروع عنصرًا تعليميًا؛ ويمكن تمويل المستلزمات الطبية إذا كانت تتيح التعليم أو التدريب (مثل تدريب العاملين الصحيين).","⟦A⟧For a UK charity:⟦/A⟧ For local organisations. Support your Palestinian partner to apply.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ للمنظمات المحلية. ادعموا شريككم الفلسطيني للتقديم.","⟦A⟧For a UK charity:⟦/A⟧ For local women-led organisations. Support a local partner to apply.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ للمنظمات المحلية التي تقودها نساء. ادعموا شريكًا محليًا للتقديم.","⟦A⟧For a UK charity:⟦/A⟧ For organisations registered in Lebanon. Apply through your Lebanese registration or a local partner.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ للمنظمات المسجلة في لبنان. قدّموا عبر تسجيلكم اللبناني أو شريك محلي.","⟦A⟧For a UK charity:⟦/A⟧ Funds international NGOs (e.g. MSF, Oxfam, Mercy Corps, Penny Appeal). Approach directly with a project concept.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تموّل المنظمات الدولية (مثل MSF وOxfam وMercy Corps وPenny Appeal). تواصلوا مباشرة بفكرة مشروع.","⟦A⟧For a UK charity:⟦/A⟧ Go in through a Swedish framework partner organisation.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ ادخلوا عبر منظمة شريكة سويدية إطارية.","⟦A⟧For a UK charity:⟦/A⟧ Has funded UK charities working overseas, including Medical Aid for Palestinians.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ موّلت جمعيات بريطانية تعمل في الخارج، منها Medical Aid for Palestinians.","⟦A⟧For a UK charity:⟦/A⟧ Has funded international NGOs before (e.g. Islamic Relief in Jordan). Approach with a concept note.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ موّلت منظمات دولية من قبل (مثل الإغاثة الإسلامية في الأردن). تواصلوا بمذكرة مفاهيمية.","⟦A⟧For a UK charity:⟦/A⟧ Has signed agreements with international NGOs and UN agencies. Expect concept note first, then full proposal on invitation.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ وقّعت اتفاقيات مع منظمات دولية ووكالات أممية. توقعوا مذكرة مفاهيمية أولًا، ثم مقترحًا كاملًا بدعوة.","⟦A⟧For a UK charity:⟦/A⟧ Implement through a certified EU partner, or set up an EU entity.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ نفّذوا عبر شريك أوروبي معتمد، أو أسسوا كيانًا في الاتحاد الأوروبي.","⟦A⟧For a UK charity:⟦/A⟧ Implement through a certified EU partner.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ نفّذوا عبر شريك أوروبي معتمد.","⟦A⟧For a UK charity:⟦/A⟧ International NGOs can apply after capacity assessment. The fund increasingly prioritises local NGOs, so a joint approach with a Yemeni partner is strongest.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ يمكن للمنظمات الدولية التقديم بعد تقييم القدرات. يعطي الصندوق أولوية متزايدة للمنظمات المحلية، لذا فالنهج المشترك مع شريك يمني هو الأقوى.","⟦A⟧For a UK charity:⟦/A⟧ International NGOs can approach SDC directly, usually through Swiss embassies in your countries of operation.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ يمكن للمنظمات الدولية التواصل مع SDC مباشرة، عادة عبر السفارات السويسرية في بلدان عملكم.","⟦A⟧For a UK charity:⟦/A⟧ International NGOs can be funded after registration and capacity assessment; for a new charity, partner with a Sudanese NGO already assessed by the fund.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ يمكن تمويل المنظمات الدولية بعد التسجيل وتقييم القدرات؛ وللجمعية الجديدة: اشتركوا مع منظمة سودانية سبق أن قيّمها الصندوق.","⟦A⟧For a UK charity:⟦/A⟧ International NGOs compete in the first category (US{n}).":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تتنافس المنظمات الدولية في الفئة الأولى (US{n}).","⟦A⟧For a UK charity:⟦/A⟧ International NGOs operating in Syria can apply once registered on the UN Partner Portal and cleared by the fund's capacity assessment.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ يمكن للمنظمات الدولية العاملة في سوريا التقديم بعد التسجيل في بوابة شركاء الأمم المتحدة واجتياز تقييم القدرات الخاص بالصندوق.","⟦A⟧For a UK charity:⟦/A⟧ International NGOs working in Lebanon can apply after UN Partner Portal registration and the GMS capacity assessment.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ يمكن للمنظمات الدولية العاملة في لبنان التقديم بعد التسجيل في بوابة شركاء الأمم المتحدة وتقييم القدرات في GMS.","⟦A⟧For a UK charity:⟦/A⟧ Japanese member NGOs only. Act as their implementing partner.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ للمنظمات اليابانية الأعضاء فقط. اعملوا كشريك منفذ لها.","⟦A⟧For a UK charity:⟦/A⟧ Lebanese-registered applicants only. Apply through your Lebanese registration or a local partner.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ للمتقدمين المسجلين في لبنان فقط. قدّموا عبر تسجيلكم اللبناني أو شريك محلي.","⟦A⟧For a UK charity:⟦/A⟧ Made for small UK charities working overseas.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ مصممة للجمعيات البريطانية الصغيرة العاملة في الخارج.","⟦A⟧For a UK charity:⟦/A⟧ Mainly for German-registered NGOs. Partner with a German NGO.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ أساسًا للمنظمات المسجلة في ألمانيا. اشتركوا مع منظمة ألمانية.","⟦A⟧For a UK charity:⟦/A⟧ Mainly for Jordanian organisations; a UK charity would need a Jordanian partner to lead.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ أساسًا للمنظمات الأردنية؛ تحتاج الجمعية البريطانية إلى شريك أردني يقود الطلب.","⟦A⟧For a UK charity:⟦/A⟧ Money goes to governments. Get in as implementing partner on a ministry of health project.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تذهب الأموال إلى الحكومات. ادخلوا كشريك منفذ في مشروع لوزارة الصحة.","⟦A⟧For a UK charity:⟦/A⟧ No open call. Most money goes via UNRWA, the Red Crescents and Irish NGOs, so the realistic routes are a direct approach to the Ramallah office with a health proposal, or implementing partner of an Irish NGO (GOAL, Concern, Trócaire).":"⟦A⟧لجمعية بريطانية:⟦/A⟧ لا توجد دعوة مفتوحة. يذهب معظم التمويل عبر الأونروا والهلال الأحمر والمنظمات الأيرلندية، فالطريق الواقعي هو التواصل المباشر مع مكتب رام الله بمقترح صحي، أو العمل كشريك منفذ لمنظمة أيرلندية (GOAL وConcern وTrócaire).","⟦A⟧For a UK charity:⟦/A⟧ Only ECHO-certified (EU-registered) NGOs can lead. A UK charity can implement as a partner of a certified NGO, or set up an EU entity for the {n} certificate.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ لا يمكن أن تقود إلا المنظمات المعتمدة من ECHO (المسجلة في الاتحاد الأوروبي). يمكن لجمعية بريطانية التنفيذ كشريك لمنظمة معتمدة، أو تأسيس كيان أوروبي للحصول على شهادة {n}.","⟦A⟧For a UK charity:⟦/A⟧ Only German GLOHRA members can apply. Join as a collaborator.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ لا يمكن التقديم إلا لأعضاء GLOHRA الألمان. انضموا كمتعاونين.","⟦A⟧For a UK charity:⟦/A⟧ Only Iraq-registered organisations. Apply through your Iraqi registration or a local partner.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ للمنظمات المسجلة في العراق فقط. قدّموا عبر تسجيلكم العراقي أو شريك محلي.","⟦A⟧For a UK charity:⟦/A⟧ Only Italian AICS-registered NGOs can lead. Join as their implementing partner.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ لا يمكن أن تقود إلا المنظمات الإيطالية المسجلة في AICS. انضموا كشريك منفذ لها.","⟦A⟧For a UK charity:⟦/A⟧ Only Italian AICS-registered organisations can lead. Join as a partner.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ لا يمكن أن تقود إلا المنظمات الإيطالية المسجلة في AICS. انضموا كشريك.","⟦A⟧For a UK charity:⟦/A⟧ Only NGOs established in an EU member state are eligible. The route is an EU-registered sister entity (e.g. in Ireland, Belgium or the Netherlands) that applies in its own right.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ لا تؤهَّل إلا المنظمات المؤسسة في دولة عضو في الاتحاد الأوروبي. الطريق هو كيان شقيق مسجل في الاتحاد الأوروبي (مثل أيرلندا أو بلجيكا أو هولندا) يتقدم باسمه.","⟦A⟧For a UK charity:⟦/A⟧ Only certified EU partners can lead. A UK charity can act as an implementing partner of a certified NGO.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ لا يمكن أن يقود إلا الشركاء الأوروبيون المعتمدون. يمكن لجمعية بريطانية العمل كشريك منفذ لمنظمة معتمدة.","⟦A⟧For a UK charity:⟦/A⟧ Open internationally. Apply in partnership with a research institution.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ مفتوحة دوليًا. قدّموا بالشراكة مع مؤسسة بحثية.","⟦A⟧For a UK charity:⟦/A⟧ Open to NGOs worldwide.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ مفتوحة للمنظمات غير الحكومية حول العالم.","⟦A⟧For a UK charity:⟦/A⟧ Open to nonprofits worldwide, by nomination.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ مفتوحة للمنظمات غير الربحية حول العالم، بالترشيح.","⟦A⟧For a UK charity:⟦/A⟧ Open to organisations worldwide that assist torture survivors.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ مفتوحة للمنظمات حول العالم التي تساعد الناجين من التعذيب.","⟦A⟧For a UK charity:⟦/A⟧ Open to organisations worldwide, provided the project has a research element and runs in a focus country.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ مفتوحة للمنظمات حول العالم، بشرط أن يتضمن المشروع عنصرًا بحثيًا ويُنفّذ في دولة ذات أولوية.","⟦A⟧For a UK charity:⟦/A⟧ Open to organisations worldwide.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ مفتوحة للمنظمات حول العالم.","⟦A⟧For a UK charity:⟦/A⟧ Partners with international NGOs.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تتشارك مع المنظمات الدولية.","⟦A⟧For a UK charity:⟦/A⟧ Partners with international NGOs. The relationship is built through its partnership department.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تتشارك مع المنظمات الدولية. تُبنى العلاقة عبر إدارة الشراكات لديها.","⟦A⟧For a UK charity:⟦/A⟧ Partnership-led, no open call. Pitch jointly with a local partner or government entity.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ قائمة على الشراكات، بلا دعوة مفتوحة. اعرضوا مشروعكم بالاشتراك مع شريك محلي أو جهة حكومية.","⟦A⟧For a UK charity:⟦/A⟧ Partnership-led: send a concept note. Projects with a strong local partner in the region fit best.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ قائمة على الشراكات: أرسلوا مذكرة مفاهيمية. تناسبها المشاريع التي لها شريك محلي قوي في المنطقة.","⟦A⟧For a UK charity:⟦/A⟧ Past rounds favoured applicants based in Denmark or the Nordics. Check the {n} guidelines, or partner with a Danish organisation.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ فضّلت الجولات السابقة المتقدمين في الدنمارك أو دول الشمال. راجعوا إرشادات {n}، أو اشتركوا مع منظمة دنماركية.","⟦A⟧For a UK charity:⟦/A⟧ Prioritises small UK charities, which fits Al Risaleh.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تعطي الأولوية للجمعيات البريطانية الصغيرة، وهذا يناسب مؤسسة الرسالة.","⟦A⟧For a UK charity:⟦/A⟧ Register once on the UN Partner Portal, then apply to UNICEF, UNHCR, WFP and UNFPA calls.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ سجّلوا مرة واحدة في بوابة شركاء الأمم المتحدة، ثم قدّموا لدعوات اليونيسف والمفوضية وبرنامج الأغذية العالمي وصندوق الأمم المتحدة للسكان.","⟦A⟧For a UK charity:⟦/A⟧ Requires HAC registration in Sudan, so apply through a Sudanese partner.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تتطلب التسجيل لدى مفوضية العون الإنساني في السودان، لذا قدّموا عبر شريك سوداني.","⟦A⟧For a UK charity:⟦/A⟧ Some embassies (e.g. Cairo for Egypt, Sudan and Eritrea) accept international NGOs. Others prefer locally registered organisations.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ بعض السفارات (مثل القاهرة لمصر والسودان وإريتريا) تقبل المنظمات الدولية. وتفضّل أخرى المنظمات المسجلة محليًا.","⟦A⟧For a UK charity:⟦/A⟧ Supports both national and international NGOs. Register on the UN Partner Portal and complete the GMS capacity assessment.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تدعم المنظمات الوطنية والدولية. سجّلوا في بوابة شركاء الأمم المتحدة وأكملوا تقييم القدرات في GMS.","⟦A⟧For a UK charity:⟦/A⟧ Taawon works with {n} local civil society organisations in Gaza and international partners such as GOAL. A partnership proposal is the route.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تعمل مؤسسة التعاون مع {n} منظمة مجتمع مدني محلية في غزة وشركاء دوليين مثل GOAL. مقترح الشراكة هو الطريق.","⟦A⟧For a UK charity:⟦/A⟧ Team up with an NHS trust, university or UK health body as the lead.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ اشتركوا مع هيئة NHS أو جامعة أو جهة صحية بريطانية تكون هي القائدة.","⟦A⟧For a UK charity:⟦/A⟧ The UK is associated to Horizon Europe, so UK organisations can join and even lead consortia with full funding.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ المملكة المتحدة مشاركة في Horizon Europe، لذا يمكن للمنظمات البريطانية الانضمام إلى الائتلافات بل وقيادتها بتمويل كامل.","⟦A⟧For a UK charity:⟦/A⟧ The UK is not associated to EU{n}Health. UK organisations can only join as unfunded associated partners.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ المملكة المتحدة غير مشاركة في EU{n}Health. لا يمكن للمنظمات البريطانية الانضمام إلا كشركاء مرتبطين بلا تمويل.","⟦A⟧For a UK charity:⟦/A⟧ UK NGOs can lead EU external-aid grants for actions in Least Developed and Highly Indebted Poor Countries, plus human rights and peace programmes. Elsewhere, join as co-applicant or partner.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ يمكن للمنظمات البريطانية قيادة منح المساعدات الخارجية الأوروبية للأنشطة في الدول الأقل نموًا والدول الفقيرة المثقلة بالديون، إضافة إلى برامج حقوق الإنسان والسلام. وفي غيرها، انضموا كمتقدم مشارك أو شريك.","⟦A⟧For a UK charity:⟦/A⟧ UK organisations are fully eligible (Horizon Europe association) and can lead or join consortia. Consortia must include partners from {n} countries.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ المنظمات البريطانية مؤهلة بالكامل (مشاركة في Horizon Europe) ويمكنها قيادة الائتلافات أو الانضمام إليها. يجب أن يضم الائتلاف شركاء من {n} دول.","⟦A⟧For a UK charity:⟦/A⟧ UK-based partners are accepted, but only for work in its focus countries (currently Africa, not the Middle East).":"⟦A⟧لجمعية بريطانية:⟦/A⟧ يُقبل الشركاء في المملكة المتحدة، لكن فقط للعمل في دولها ذات الأولوية (حاليًا أفريقيا، لا الشرق الأوسط).","⟦A⟧For a UK charity:⟦/A⟧ UK-funded. Partner with a UK or LMIC university and act as the implementing and research NGO.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ ممولة بريطانيًا. اشتركوا مع جامعة بريطانية أو في دولة منخفضة/متوسطة الدخل واعملوا كمنظمة منفذة وبحثية.","⟦A⟧For a UK charity:⟦/A⟧ UK-government funded and open to humanitarian NGOs.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ ممولة من الحكومة البريطانية ومفتوحة للمنظمات الإنسانية.","⟦A⟧For a UK charity:⟦/A⟧ Usually for organisations registered in Palestine. Apply through your Palestinian branch or a local partner.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ عادة للمنظمات المسجلة في فلسطين. قدّموا عبر فرعكم الفلسطيني أو شريك محلي.","⟦A⟧For a UK charity:⟦/A⟧ Usually led by research teams. Partner with a university and act as the implementing NGO.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ تقودها عادة فرق بحثية. اشتركوا مع جامعة واعملوا كمنظمة منفذة.","⟦A⟧For a UK charity:⟦/A⟧ You can't apply directly. Partner with one of the {n} Irish NGOs. GOAL already funds Gaza healthcare with Taawon; Concern works in Lebanon and Syria/Iraq.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ لا يمكنكم التقديم مباشرة. اشتركوا مع إحدى المنظمات الأيرلندية الـ{n}. تموّل GOAL بالفعل الرعاية الصحية في غزة مع مؤسسة التعاون؛ وتعمل Concern في لبنان وسوريا/العراق.","⟦A⟧For a UK charity:⟦/A⟧ Your home government donor. Bid directly or as part of a consortium.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ الجهة المانحة الحكومية في بلدكم. قدّموا مباشرة أو ضمن ائتلاف.","⟦A⟧For a UK charity:⟦/A⟧ Your home government. No open call, but FCDO funds UK medical NGOs directly (it funds UK-Med's Gaza field hospitals). Approach the FCDO OPT team / British Consulate-General Jerusalem.":"⟦A⟧لجمعية بريطانية:⟦/A⟧ حكومة بلدكم. لا توجد دعوة مفتوحة، لكن FCDO تموّل المنظمات الطبية البريطانية مباشرة (تموّل مستشفيات UK-Med الميدانية في غزة). تواصلوا مع فريق FCDO للأراضي الفلسطينية المحتلة / القنصلية البريطانية العامة في القدس.","⟦A⟧Gulf funders are relationship-led:⟦/A⟧ short Arabic + English concept note, an introduction or visit, visibility plan, and Zakat-eligible budgets where it fits.":"⟦A⟧الجهات المانحة الخليجية تعتمد على العلاقات:⟦/A⟧ مذكرة مفاهيمية قصيرة بالعربية والإنجليزية، وتعريف أو زيارة، وخطة ظهور، وميزانيات مؤهلة للزكاة حيث يناسب.","⟦A⟧How to access:⟦/A⟧ Annual cycle ({n} closed). Watch for the {n} round.":"⟦A⟧طريقة الوصول:⟦/A⟧ دورة سنوية (أُغلقت {n}). ترقبوا جولة {n}.","⟦A⟧How to access:⟦/A⟧ Annual round ({n} ran June–August).":"⟦A⟧طريقة الوصول:⟦/A⟧ جولة سنوية (جولة {n} كانت من يونيو إلى أغسطس).","⟦A⟧How to access:⟦/A⟧ Apply to join as an NGO partner before a crisis so you can request airlift quickly.":"⟦A⟧طريقة الوصول:⟦/A⟧ قدّموا للانضمام كشريك قبل الأزمة لتتمكنوا من طلب الجسر الجوي بسرعة.","⟦A⟧How to access:⟦/A⟧ Approach their country teams with a joint health project.":"⟦A⟧طريقة الوصول:⟦/A⟧ تواصلوا مع فرقها القُطرية بمشروع صحي مشترك.","⟦A⟧How to access:⟦/A⟧ Approach via the UAE embassy or an Emirati partner organisation.":"⟦A⟧طريقة الوصول:⟦/A⟧ تواصلوا عبر سفارة الإمارات أو منظمة إماراتية شريكة.","⟦A⟧How to access:⟦/A⟧ Ask Irish Aid about an invitation, or register an Irish entity.":"⟦A⟧طريقة الوصول:⟦/A⟧ اسألوا Irish Aid عن دعوة، أو سجّلوا كيانًا أيرلنديًا.","⟦A⟧How to access:⟦/A⟧ Become a member; see Find grants.":"⟦A⟧طريقة الوصول:⟦/A⟧ كونوا أعضاء؛ انظروا «البحث عن منح».","⟦A⟧How to access:⟦/A⟧ Best for partner health facilities in Ghana, Kenya, Nigeria, Tanzania and similar markets.":"⟦A⟧طريقة الوصول:⟦/A⟧ الأنسب للمرافق الصحية الشريكة في غانا وكينيا ونيجيريا وتنزانيا وأسواق مماثلة.","⟦A⟧How to access:⟦/A⟧ By invitation; build a relationship.":"⟦A⟧طريقة الوصول:⟦/A⟧ بدعوة؛ ابنوا علاقة.","⟦A⟧How to access:⟦/A⟧ Check which funds are open.":"⟦A⟧طريقة الوصول:⟦/A⟧ تحققوا من الصناديق المفتوحة.","⟦A⟧How to access:⟦/A⟧ Complete the capacity assessment in each country you work in.":"⟦A⟧طريقة الوصول:⟦/A⟧ أكملوا تقييم القدرات في كل بلد تعملون فيه.","⟦A⟧How to access:⟦/A⟧ Concept note to FCDO country teams; your home government.":"⟦A⟧طريقة الوصول:⟦/A⟧ مذكرة مفاهيمية للفرق القُطرية في FCDO؛ حكومة بلدكم.","⟦A⟧How to access:⟦/A⟧ Concept note to the Ramallah office; or partner with an Irish NGO.":"⟦A⟧طريقة الوصول:⟦/A⟧ مذكرة مفاهيمية لمكتب رام الله؛ أو الشراكة مع منظمة أيرلندية.","⟦A⟧How to access:⟦/A⟧ Concept note to the grants team.":"⟦A⟧طريقة الوصول:⟦/A⟧ مذكرة مفاهيمية لفريق المنح.","⟦A⟧How to access:⟦/A⟧ Concept note via website.":"⟦A⟧طريقة الوصول:⟦/A⟧ مذكرة مفاهيمية عبر الموقع الإلكتروني.","⟦A⟧How to access:⟦/A⟧ Concept note; prize via online nomination.":"⟦A⟧طريقة الوصول:⟦/A⟧ مذكرة مفاهيمية؛ والجائزة بالترشيح عبر الإنترنت.","⟦A⟧How to access:⟦/A⟧ Coordinate medical supply shipments.":"⟦A⟧طريقة الوصول:⟦/A⟧ تنسيق شحنات المستلزمات الطبية.","⟦A⟧How to access:⟦/A⟧ Country offices (Gaza, Türkiye/Syria) are a good first contact.":"⟦A⟧طريقة الوصول:⟦/A⟧ المكاتب القُطرية (غزة، تركيا/سوريا) نقطة تواصل أولى جيدة.","⟦A⟧How to access:⟦/A⟧ Design Zakat-eligible projects (direct aid to eligible recipients) and keep Zakat funds ring-fenced.":"⟦A⟧طريقة الوصول:⟦/A⟧ صمّموا مشاريع مؤهلة للزكاة (مساعدة مباشرة للمستحقين) وافصلوا أموال الزكاة.","⟦A⟧How to access:⟦/A⟧ For a health social enterprise, not core NGO costs.":"⟦A⟧طريقة الوصول:⟦/A⟧ لمؤسسة اجتماعية صحية، لا للتكاليف الأساسية للمنظمة.","⟦A⟧How to access:⟦/A⟧ Implementing partner on government programmes.":"⟦A⟧طريقة الوصول:⟦/A⟧ شريك منفذ في البرامج الحكومية.","⟦A⟧How to access:⟦/A⟧ Join the health cluster in each country where you work.":"⟦A⟧طريقة الوصول:⟦/A⟧ انضموا إلى المجموعة الصحية في كل بلد تعملون فيه.","⟦A⟧How to access:⟦/A⟧ Local registration needed; best for medical equipment.":"⟦A⟧طريقة الوصول:⟦/A⟧ يلزم التسجيل المحلي؛ الأنسب للمعدات الطبية.","⟦A⟧How to access:⟦/A⟧ Make sure your charity is listed and due-diligence ready (see Organisation & documents).":"⟦A⟧طريقة الوصول:⟦/A⟧ تأكدوا أن جمعيتكم مدرجة وجاهزة للعناية الواجبة (انظروا «المنظمة والوثائق»).","⟦A⟧How to access:⟦/A⟧ Membership fee by income band; very useful for a UK charity.":"⟦A⟧طريقة الوصول:⟦/A⟧ رسوم العضوية حسب شريحة الدخل؛ مفيدة جدًا لجمعية بريطانية.","⟦A⟧How to access:⟦/A⟧ Membership has strict size and track-record criteria. The realistic route is to be an implementing partner of a DEC member in your areas of operation.":"⟦A⟧طريقة الوصول:⟦/A⟧ للعضوية معايير صارمة للحجم والسجل. الطريق الواقعي هو أن تكونوا شريكًا منفذًا لعضو في DEC في مناطق عملكم.","⟦A⟧How to access:⟦/A⟧ Monthly: apply by the last Monday of each month. Max {n} pages + latest audited accounts.":"⟦A⟧طريقة الوصول:⟦/A⟧ شهريًا: قدّموا قبل آخر يوم إثنين من كل شهر. بحد أقصى {n} صفحات + آخر حسابات مدققة.","⟦A⟧How to access:⟦/A⟧ Mostly by invitation. Use the Access to Medicine Index to see each company’s priority countries & diseases, then approach their corporate affairs / access teams.":"⟦A⟧طريقة الوصول:⟦/A⟧ غالبًا بدعوة. استخدموا مؤشر Access to Medicine لمعرفة الدول والأمراض ذات الأولوية لكل شركة، ثم تواصلوا مع فرق الشؤون المؤسسية / الوصول لديها.","⟦A⟧How to access:⟦/A⟧ Operational partnerships, especially health.":"⟦A⟧طريقة الوصول:⟦/A⟧ شراكات تشغيلية، خاصة في الصحة.","⟦A⟧How to access:⟦/A⟧ Partnership for medical supplies and convoys.":"⟦A⟧طريقة الوصول:⟦/A⟧ شراكة للمستلزمات الطبية والقوافل.","⟦A⟧How to access:⟦/A⟧ Partnership proposal.":"⟦A⟧طريقة الوصول:⟦/A⟧ مقترح شراكة.","⟦A⟧How to access:⟦/A⟧ Partnership-led, ≥{n}-year commitments.":"⟦A⟧طريقة الوصول:⟦/A⟧ قائمة على الشراكات، بالتزامات ≥{n} سنوات.","⟦A⟧How to access:⟦/A⟧ Partnership-led.":"⟦A⟧طريقة الوصول:⟦/A⟧ قائمة على الشراكات.","⟦A⟧How to access:⟦/A⟧ Partnerships department; field offices in the region.":"⟦A⟧طريقة الوصول:⟦/A⟧ إدارة الشراكات؛ ومكاتب ميدانية في المنطقة.","⟦A⟧How to access:⟦/A⟧ Register a PIC; set alerts for Palestine, Lebanon, Iraq.":"⟦A⟧طريقة الوصول:⟦/A⟧ سجّلوا رمز PIC؛ وفعّلوا التنبيهات لفلسطين ولبنان والعراق.","⟦A⟧How to access:⟦/A⟧ Register on the UN Partner Portal and filter by country.":"⟦A⟧طريقة الوصول:⟦/A⟧ سجّلوا في بوابة شركاء الأمم المتحدة وصفّوا حسب البلد.","⟦A⟧How to access:⟦/A⟧ Register on the UN Partner Portal; join health & nutrition clusters in-country.":"⟦A⟧طريقة الوصول:⟦/A⟧ سجّلوا في بوابة شركاء الأمم المتحدة؛ وانضموا إلى مجموعتي الصحة والتغذية في البلد.","⟦A⟧How to access:⟦/A⟧ Register your charity (Benevity, also via CAF in the UK) so employees of partner companies can give and get matched.":"⟦A⟧طريقة الوصول:⟦/A⟧ سجّلوا جمعيتكم (Benevity، وأيضًا عبر CAF في المملكة المتحدة) ليتمكن موظفو الشركات الشريكة من التبرع والحصول على المضاعفة.","⟦A⟧How to access:⟦/A⟧ Relationship-led.":"⟦A⟧طريقة الوصول:⟦/A⟧ تعتمد على العلاقات.","⟦A⟧How to access:⟦/A⟧ Relationship-led: concept note to the partnerships team.":"⟦A⟧طريقة الوصول:⟦/A⟧ تعتمد على العلاقات: مذكرة مفاهيمية لفريق الشراكات.","⟦A⟧How to access:⟦/A⟧ Relationship-led; Zakat-eligible project designs help. See Find grants for KSrelief and QFFD.":"⟦A⟧طريقة الوصول:⟦/A⟧ تعتمد على العلاقات؛ وتساعد تصاميم المشاريع المؤهلة للزكاة. انظروا «البحث عن منح» لمركز الملك سلمان وصندوق قطر للتنمية.","⟦A⟧How to access:⟦/A⟧ Relationship-led; often via Palestinian partners.":"⟦A⟧طريقة الوصول:⟦/A⟧ تعتمد على العلاقات؛ وغالبًا عبر شركاء فلسطينيين.","⟦A⟧How to access:⟦/A⟧ Research partnerships; usually with a university.":"⟦A⟧طريقة الوصول:⟦/A⟧ شراكات بحثية؛ عادة مع جامعة.","⟦A⟧How to access:⟦/A⟧ Route in via government health projects.":"⟦A⟧طريقة الوصول:⟦/A⟧ الدخول عبر المشاريع الصحية الحكومية.","⟦A⟧How to access:⟦/A⟧ Route in: become a partner of International Health Partners (UK) or Direct Relief: see the Medical section.":"⟦A⟧طريقة الوصول:⟦/A⟧ الدخول: كونوا شريكًا لـInternational Health Partners (المملكة المتحدة) أو Direct Relief: انظروا القسم الطبي.","⟦A⟧How to access:⟦/A⟧ Route in: implementing partner on government-financed health projects.":"⟦A⟧طريقة الوصول:⟦/A⟧ الدخول: شريك منفذ في مشاريع صحية بتمويل حكومي.","⟦A⟧How to access:⟦/A⟧ Security required: charity assets may be at risk.":"⟦A⟧طريقة الوصول:⟦/A⟧ يلزم ضمان: قد تتعرض أصول الجمعية للخطر.","⟦A⟧How to access:⟦/A⟧ Short enquiry form. Needs at least {n} year of trading, turnover of {n}+, and a clear plan for how the finance makes you more sustainable.":"⟦A⟧طريقة الوصول:⟦/A⟧ نموذج استفسار قصير. يتطلب سنة {n} على الأقل من النشاط، وإيرادات {n}+، وخطة واضحة لكيف يجعلكم التمويل أكثر استدامة.","⟦A⟧How to access:⟦/A⟧ Three grant rounds a year.":"⟦A⟧طريقة الوصول:⟦/A⟧ ثلاث جولات منح في السنة.","⟦A⟧How to access:⟦/A⟧ UN Partner Portal + GMS capacity assessment in each country.":"⟦A⟧طريقة الوصول:⟦/A⟧ بوابة شركاء الأمم المتحدة + تقييم القدرات في GMS في كل بلد.","⟦A⟧How to access:⟦/A⟧ Use a locally registered branch or partner.":"⟦A⟧طريقة الوصول:⟦/A⟧ استخدموا فرعًا أو شريكًا مسجلًا محليًا.","⟦A⟧How to access:⟦/A⟧ Via a certified EU partner, or your own EU entity ({n} certificate).":"⟦A⟧طريقة الوصول:⟦/A⟧ عبر شريك أوروبي معتمد، أو كيانكم الأوروبي الخاص (شهادة {n}).","⟦A⟧How to access:⟦/A⟧ Watch for the annual request for proposals; partnerships are typically USD multi-million over several years.":"⟦A⟧طريقة الوصول:⟦/A⟧ ترقبوا طلب المقترحات السنوي؛ الشراكات عادة بملايين الدولارات على عدة سنوات.","⟦A⟧How to apply:⟦/A⟧ A nominator from outside your staff creates an account on the Hilton nominations portal and uploads a signed letter (max {n} pages). You then complete Phase {n} online within about {n} working days.":"⟦A⟧طريقة التقديم:⟦/A⟧ يُنشئ مرشِّح من خارج موظفيكم حسابًا في بوابة ترشيحات Hilton ويرفع خطابًا موقعًا (بحد أقصى {n} صفحات). ثم تُكملون المرحلة {n} عبر الإنترنت خلال نحو {n} يوم عمل.","⟦A⟧How to apply:⟦/A⟧ A third-party nominator fills in the e-nomination form on AGFUND's website with an official nomination letter.":"⟦A⟧طريقة التقديم:⟦/A⟧ يملأ مرشِّح من طرف ثالث نموذج الترشيح الإلكتروني على موقع AGFUND مع خطاب ترشيح رسمي.","⟦A⟧How to apply:⟦/A⟧ Annual call for proposals on Ireland.ie (Irish Aid civil society page); application form plus tax clearance or equivalent.":"⟦A⟧طريقة التقديم:⟦/A⟧ دعوة سنوية لتقديم المقترحات على Ireland.ie (صفحة المجتمع المدني في Irish Aid)؛ نموذج طلب مع شهادة براءة ذمة ضريبية أو ما يعادلها.","⟦A⟧How to apply:⟦/A⟧ Apply any time via the Trust's website; trustees decide once a year, usually in March.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا في أي وقت عبر موقع الصندوق؛ يقرر الأمناء مرة سنويًا، عادة في مارس.","⟦A⟧How to apply:⟦/A⟧ Apply for Start Network membership. Members then respond to crisis alerts within days.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا لعضوية Start Network. يستجيب الأعضاء بعدها لتنبيهات الأزمات خلال أيام.","⟦A⟧How to apply:⟦/A⟧ Apply on SmartyGrants in the Beirut DAP round.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا على SmartyGrants في جولة DAP في بيروت.","⟦A⟧How to apply:⟦/A⟧ Apply online during the annual application cycle.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا عبر الإنترنت خلال دورة التقديم السنوية.","⟦A⟧How to apply:⟦/A⟧ Apply online on the DIV Fund website; rolling.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا عبر موقع صندوق DIV؛ التقديم مفتوح باستمرار.","⟦A⟧How to apply:⟦/A⟧ Apply online on the FID website; rolling.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا عبر موقع FID؛ التقديم مفتوح باستمرار.","⟦A⟧How to apply:⟦/A⟧ Apply online to open Grand Challenges requests for proposals (short initial proposal).":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا عبر الإنترنت لطلبات مقترحات Grand Challenges المفتوحة (مقترح أولي قصير).","⟦A⟧How to apply:⟦/A⟧ Apply online via the Trust; small and medium grants are considered every month.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا عبر الإنترنت من خلال الصندوق؛ تُدرس المنح الصغيرة والمتوسطة كل شهر.","⟦A⟧How to apply:⟦/A⟧ Apply through CISU’s online system (Danish organisations).":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا عبر نظام CISU الإلكتروني (للمنظمات الدنماركية).","⟦A⟧How to apply:⟦/A⟧ Apply through Elrha when the next call opens.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا عبر Elrha عند فتح الدعوة التالية.","⟦A⟧How to apply:⟦/A⟧ Apply through UKHIH/Elrha call pages when they open.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا عبر صفحات دعوات UKHIH/Elrha عند فتحها.","⟦A⟧How to apply:⟦/A⟧ Apply through the Novo Nordisk Foundation’s NORMA portal when the call opens.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا عبر بوابة NORMA التابعة لمؤسسة Novo Nordisk عند فتح الدعوة.","⟦A⟧How to apply:⟦/A⟧ Apply through the RFP page.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا عبر صفحة طلب المقترحات.","⟦A⟧How to apply:⟦/A⟧ Apply through the WPHF Rapid Response Window page.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا عبر صفحة نافذة الاستجابة السريعة في WPHF.","⟦A⟧How to apply:⟦/A⟧ Apply to the Polish Embassy in Beirut during the annual call.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا إلى السفارة البولندية في بيروت خلال الدعوة السنوية.","⟦A⟧How to apply:⟦/A⟧ Apply when the next round opens: concept note first, then a full application.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا عند فتح الجولة التالية: مذكرة مفاهيمية أولًا، ثم طلب كامل.","⟦A⟧How to apply:⟦/A⟧ Approach Taawon's partnerships team (Ramallah/Amman) with a joint health proposal.":"⟦A⟧طريقة التقديم:⟦/A⟧ تواصلوا مع فريق الشراكات في مؤسسة التعاون (رام الله/عمّان) بمقترح صحي مشترك.","⟦A⟧How to apply:⟦/A⟧ Approach the country teams of GOAL, Concern, Trócaire or Christian Aid Ireland with a joint project idea.":"⟦A⟧طريقة التقديم:⟦/A⟧ تواصلوا مع الفرق القُطرية لـGOAL أو Concern أو Trócaire أو Christian Aid Ireland بفكرة مشروع مشترك.","⟦A⟧How to apply:⟦/A⟧ Approach the partnerships team; no public application form.":"⟦A⟧طريقة التقديم:⟦/A⟧ تواصلوا مع فريق الشراكات؛ لا يوجد نموذج تقديم عام.","⟦A⟧How to apply:⟦/A⟧ As implementing partner of a Japanese member NGO.":"⟦A⟧طريقة التقديم:⟦/A⟧ كشريك منفذ لمنظمة يابانية عضو.","⟦A⟧How to apply:⟦/A⟧ Calls are listed on NIHR’s funding pages; you need UK and low/middle-income-country joint lead applicants.":"⟦A⟧طريقة التقديم:⟦/A⟧ تُنشر الدعوات في صفحات تمويل NIHR؛ تحتاجون متقدمَين رئيسيين مشتركين من المملكة المتحدة ومن دولة منخفضة/متوسطة الدخل.","⟦A⟧How to apply:⟦/A⟧ Calls go on the EU Funding & Tenders Portal (UK organisations can join only as unfunded partners).":"⟦A⟧طريقة التقديم:⟦/A⟧ تُنشر الدعوات على بوابة التمويل والمناقصات الأوروبية (لا يمكن للمنظمات البريطانية الانضمام إلا كشركاء بلا تمويل).","⟦A⟧How to apply:⟦/A⟧ Certified partners submit a Single Form through ECHO’s APPEL system.":"⟦A⟧طريقة التقديم:⟦/A⟧ يقدّم الشركاء المعتمدون النموذج الموحد عبر نظام APPEL التابع لـECHO.","⟦A⟧How to apply:⟦/A⟧ Certified partners submit single forms via APPEL at any time during the year.":"⟦A⟧طريقة التقديم:⟦/A⟧ يقدّم الشركاء المعتمدون النماذج الموحدة عبر APPEL في أي وقت من السنة.","⟦A⟧How to apply:⟦/A⟧ Certified partners submit via APPEL; contact ECHO's Iraq office.":"⟦A⟧طريقة التقديم:⟦/A⟧ يقدّم الشركاء المعتمدون عبر APPEL؛ تواصلوا مع مكتب ECHO في العراق.","⟦A⟧How to apply:⟦/A⟧ Certified partners submit via APPEL; talk to ECHO's Beirut and Damascus/Amman offices.":"⟦A⟧طريقة التقديم:⟦/A⟧ يقدّم الشركاء المعتمدون عبر APPEL؛ تحدثوا مع مكاتب ECHO في بيروت ودمشق/عمّان.","⟦A⟧How to apply:⟦/A⟧ Certified partners submit via ECHO's APPEL system; contact ECHO's Jerusalem office.":"⟦A⟧طريقة التقديم:⟦/A⟧ يقدّم الشركاء المعتمدون عبر نظام APPEL؛ تواصلوا مع مكتب ECHO في القدس.","⟦A⟧How to apply:⟦/A⟧ Check eligibility and HAC registration, read the RRF guidelines, complete the project proposal form; sanctions screening applies.":"⟦A⟧طريقة التقديم:⟦/A⟧ تحققوا من الأهلية والتسجيل لدى مفوضية العون الإنساني، واقرؤوا إرشادات RRF، وأكملوا نموذج مقترح المشروع؛ ويُطبّق فحص العقوبات.","⟦A⟧How to apply:⟦/A⟧ Check the Trust's website for when applications reopen.":"⟦A⟧طريقة التقديم:⟦/A⟧ راجعوا موقع الصندوق لمعرفة موعد إعادة فتح التقديم.","⟦A⟧How to apply:⟦/A⟧ Contact AGFUND's projects department with a short concept note.":"⟦A⟧طريقة التقديم:⟦/A⟧ تواصلوا مع إدارة المشاريع في AGFUND بمذكرة مفاهيمية قصيرة.","⟦A⟧How to apply:⟦/A⟧ Contact QFFD partnerships; relationship-led.":"⟦A⟧طريقة التقديم:⟦/A⟧ تواصلوا مع شراكات صندوق قطر للتنمية؛ تعتمد على العلاقات.","⟦A⟧How to apply:⟦/A⟧ Contact Qatar Charity's partnerships department or its country offices (Gaza, Türkiye/Syria) with a concept note.":"⟦A⟧طريقة التقديم:⟦/A⟧ تواصلوا مع إدارة الشراكات في قطر الخيرية أو مكاتبها القُطرية (غزة، تركيا/سوريا) بمذكرة مفاهيمية.","⟦A⟧How to apply:⟦/A⟧ Contact TBHF through its website with a concept note; partnership-led.":"⟦A⟧طريقة التقديم:⟦/A⟧ تواصلوا مع TBHF عبر موقعها بمذكرة مفاهيمية؛ قائمة على الشراكات.","⟦A⟧How to apply:⟦/A⟧ Contact the Country Coordinating Mechanism in your country about sub-recipient selection.":"⟦A⟧طريقة التقديم:⟦/A⟧ تواصلوا مع آلية التنسيق القطرية في بلدكم بشأن اختيار المستفيدين الفرعيين.","⟦A⟧How to apply:⟦/A⟧ Contact the KSrelief partnerships department; relationship-led.":"⟦A⟧طريقة التقديم:⟦/A⟧ تواصلوا مع إدارة الشراكات في مركز الملك سلمان؛ تعتمد على العلاقات.","⟦A⟧How to apply:⟦/A⟧ Contact the OPEC Fund grants team with a concept note; no open call cycle.":"⟦A⟧طريقة التقديم:⟦/A⟧ تواصلوا مع فريق المنح في صندوق أوبك بمذكرة مفاهيمية؛ لا توجد دورة دعوات مفتوحة.","⟦A⟧How to apply:⟦/A⟧ Contact the Representative Office of Ireland in Ramallah (Irish Aid team) with a concept note.":"⟦A⟧طريقة التقديم:⟦/A⟧ تواصلوا مع المكتب التمثيلي لأيرلندا في رام الله (فريق Irish Aid) بمذكرة مفاهيمية.","⟦A⟧How to apply:⟦/A⟧ Download the call package from the WPHF call page and submit as instructed there (aimed at local CSOs).":"⟦A⟧طريقة التقديم:⟦/A⟧ نزّلوا حزمة الدعوة من صفحة WPHF وقدّموا وفق التعليمات هناك (موجهة لمنظمات المجتمع المدني المحلية).","⟦A⟧How to apply:⟦/A⟧ Download the guideline and form from the Japanese Representative Office GGP page and submit any time; screening for each year usually closes in September.":"⟦A⟧طريقة التقديم:⟦/A⟧ نزّلوا الإرشادات والنموذج من صفحة GGP للمكتب التمثيلي الياباني وقدّموا في أي وقت؛ يُغلق الفرز لكل سنة عادة في سبتمبر.","⟦A⟧How to apply:⟦/A⟧ Email the preliminary application form and budget to rmlah.cfli-fcil@international.gc.ca during the annual call.":"⟦A⟧طريقة التقديم:⟦/A⟧ أرسلوا نموذج الطلب الأولي والميزانية بالبريد إلى rmlah.cfli-fcil@international.gc.ca خلال الدعوة السنوية.","⟦A⟧How to apply:⟦/A⟧ Engage ministries of health and the IsDB country office to be named as implementing partner.":"⟦A⟧طريقة التقديم:⟦/A⟧ تواصلوا مع وزارات الصحة والمكتب القُطري للبنك الإسلامي للتنمية لتُسمَّوا شريكًا منفذًا.","⟦A⟧How to apply:⟦/A⟧ Fill in the Identification Form (English), sign/stamp and email it to the Embassy in Baghdad or Consulate General in Erbil.":"⟦A⟧طريقة التقديم:⟦/A⟧ املؤوا نموذج التعريف (بالإنجليزية)، ووقّعوه واختموه وأرسلوه بالبريد إلى السفارة في بغداد أو القنصلية العامة في أربيل.","⟦A⟧How to apply:⟦/A⟧ Follow the submission instructions in the AICS call (deadline {d}, {n}:{n}).":"⟦A⟧طريقة التقديم:⟦/A⟧ اتبعوا تعليمات التقديم في دعوة AICS (الموعد النهائي {d}، {n}:{n}).","⟦A⟧How to apply:⟦/A⟧ GLOHRA members submit an outline from {d}: partner with a German member institution.":"⟦A⟧طريقة التقديم:⟦/A⟧ يقدّم أعضاء GLOHRA مخططًا أوليًا من {d}: اشتركوا مع مؤسسة ألمانية عضو.","⟦A⟧How to apply:⟦/A⟧ Go to the website of the Japanese embassy in your country and find “Grant Assistance for Grassroots Human Security Projects”; apply in its annual round (often Jan–Feb).":"⟦A⟧طريقة التقديم:⟦/A⟧ ادخلوا موقع السفارة اليابانية في بلدكم وابحثوا عن «منح المساعدة لمشاريع الأمن الإنساني الشعبية»؛ وقدّموا في جولتها السنوية (غالبًا يناير–فبراير).","⟦A⟧How to apply:⟦/A⟧ Invitation-only portal for governments. Contact the Ministry of Health or the implementing entity to be included.":"⟦A⟧طريقة التقديم:⟦/A⟧ بوابة للحكومات بدعوة فقط. تواصلوا مع وزارة الصحة أو الجهة المنفذة لإدراجكم.","⟦A⟧How to apply:⟦/A⟧ Lead applicant must be on the AICS CSO register; submit through AICS's SISTAKE platform by {d}, {n}:{n}":"⟦A⟧طريقة التقديم:⟦/A⟧ يجب أن يكون المتقدم الرئيسي مسجلًا في سجل منظمات المجتمع المدني لدى AICS؛ قدّموا عبر منصة SISTAKE قبل {d}، {n}:{n}","⟦A⟧How to apply:⟦/A⟧ Monitor FCDO funding pages and Find a Tender; bids are often made as a consortium.":"⟦A⟧طريقة التقديم:⟦/A⟧ تابعوا صفحات تمويل FCDO وFind a Tender؛ تُقدّم العروض غالبًا ضمن ائتلاف.","⟦A⟧How to apply:⟦/A⟧ On the Funding & Tenders Portal, search “HORIZON-HLTH-{n}” and submit as a consortium; stage {n} closes {d}, {n}:{n} Brussels time.":"⟦A⟧طريقة التقديم:⟦/A⟧ على بوابة التمويل والمناقصات، ابحثوا عن «HORIZON-HLTH-{n}» وقدّموا كائتلاف؛ تُغلق المرحلة {n} في {d}، {n}:{n} بتوقيت بروكسل.","⟦A⟧How to apply:⟦/A⟧ Online form on the Trust's website; trustees meet regularly through the year (deadlines roughly every {n}–{n} months).":"⟦A⟧طريقة التقديم:⟦/A⟧ نموذج إلكتروني على موقع الصندوق؛ يجتمع الأمناء بانتظام خلال السنة (المواعيد النهائية كل {n}–{n} أشهر تقريبًا).","⟦A⟧How to apply:⟦/A⟧ Open your country’s CFLI page from the list and send the designated form and budget to the Canadian embassy.":"⟦A⟧طريقة التقديم:⟦/A⟧ افتحوا صفحة CFLI لبلدكم من القائمة وأرسلوا النموذج المحدد والميزانية إلى السفارة الكندية.","⟦A⟧How to apply:⟦/A⟧ Partner with an Italian AICS-registered NGO when AICS Jerusalem publishes its next emergency call.":"⟦A⟧طريقة التقديم:⟦/A⟧ اشتركوا مع منظمة إيطالية مسجلة في AICS عندما يُصدر مكتب AICS في القدس دعوته الطارئة التالية.","⟦A⟧How to apply:⟦/A⟧ Prepare and submit in CzDA's Grantys system (signed submission) by {d}.":"⟦A⟧طريقة التقديم:⟦/A⟧ أعدّوا الطلب وقدّموه في نظام Grantys التابع لـCzDA (تقديم موقّع) قبل {d}.","⟦A⟧How to apply:⟦/A⟧ Present your project at a local Rotary club; the clubs apply to the Foundation.":"⟦A⟧طريقة التقديم:⟦/A⟧ اعرضوا مشروعكم في نادي روتاري محلي؛ والأندية هي التي تتقدم إلى المؤسسة.","⟦A⟧How to apply:⟦/A⟧ Read the GGP guideline, then submit the application form and required documents to the Embassy's Economic & Development Cooperation Division (economic@am.mofa.go.jp) during the annual call.":"⟦A⟧طريقة التقديم:⟦/A⟧ اقرؤوا إرشادات GGP، ثم قدّموا نموذج الطلب والوثائق المطلوبة إلى قسم التعاون الاقتصادي والتنموي في السفارة (economic@am.mofa.go.jp) خلال الدعوة السنوية.","⟦A⟧How to apply:⟦/A⟧ Register at dap.smartygrants.com.au and choose the round for the Australian embassy covering your country.":"⟦A⟧طريقة التقديم:⟦/A⟧ سجّلوا على dap.smartygrants.com.au واختاروا جولة السفارة الأسترالية التي تغطي بلدكم.","⟦A⟧How to apply:⟦/A⟧ Register on the UN Partner Portal and OCHA's GMS; complete the capacity assessment; apply to standard or reserve allocations announced through the clusters.":"⟦A⟧طريقة التقديم:⟦/A⟧ سجّلوا في بوابة شركاء الأمم المتحدة ونظام GMS التابع لـOCHA؛ أكملوا تقييم القدرات؛ وقدّموا للمخصصات العادية أو الاحتياطية المعلنة عبر المجموعات القطاعية.","⟦A⟧How to apply:⟦/A⟧ Register on the UN Partner Portal and OCHA's Grant Management System, complete the capacity assessment, join the health cluster and apply to allocations.":"⟦A⟧طريقة التقديم:⟦/A⟧ سجّلوا في بوابة شركاء الأمم المتحدة ونظام إدارة المنح التابع لـOCHA، وأكملوا تقييم القدرات، وانضموا إلى المجموعة الصحية وقدّموا للمخصصات.","⟦A⟧How to apply:⟦/A⟧ Register on the UN Partner Portal, then OCHA's Grant Management System (GMS); pass due diligence and capacity assessment; respond to allocation strategies through the health cluster.":"⟦A⟧طريقة التقديم:⟦/A⟧ سجّلوا في بوابة شركاء الأمم المتحدة، ثم في نظام إدارة المنح (GMS) التابع لـOCHA؛ اجتازوا العناية الواجبة وتقييم القدرات؛ واستجيبوا لاستراتيجيات التخصيص عبر المجموعة الصحية.","⟦A⟧How to apply:⟦/A⟧ Register on the UN Partner Portal, then on OCHA’s Grant Management System; complete due diligence and the capacity assessment with the fund in each country.":"⟦A⟧طريقة التقديم:⟦/A⟧ سجّلوا في بوابة شركاء الأمم المتحدة، ثم في نظام إدارة المنح التابع لـOCHA؛ أكملوا العناية الواجبة وتقييم القدرات مع الصندوق في كل بلد.","⟦A⟧How to apply:⟦/A⟧ Register your organisation, complete the profile, then respond to calls for expressions of interest.":"⟦A⟧طريقة التقديم:⟦/A⟧ سجّلوا منظمتكم، وأكملوا الملف، ثم استجيبوا لدعوات إبداء الاهتمام.","⟦A⟧How to apply:⟦/A⟧ Relationship-led: through a Swedish framework partner.":"⟦A⟧طريقة التقديم:⟦/A⟧ تعتمد على العلاقات: عبر شريك سويدي إطاري.","⟦A⟧How to apply:⟦/A⟧ Requires an EU-registered entity: submit the application plus an independent ex-ante audit, per DG ECHO’s call document.":"⟦A⟧طريقة التقديم:⟦/A⟧ يتطلب كيانًا مسجلًا في الاتحاد الأوروبي: قدّموا الطلب مع تدقيق مستقل مسبق، وفق وثيقة دعوة DG ECHO.","⟦A⟧How to apply:⟦/A⟧ Search calls by country on the Funding & Tenders Portal and submit with your PIC number.":"⟦A⟧طريقة التقديم:⟦/A⟧ ابحثوا عن الدعوات حسب البلد في بوابة التمويل والمناقصات وقدّموا برقم PIC الخاص بكم.","⟦A⟧How to apply:⟦/A⟧ Send a concept note to SDC Humanitarian Aid or the Swiss embassy in your country of operation.":"⟦A⟧طريقة التقديم:⟦/A⟧ أرسلوا مذكرة مفاهيمية إلى المساعدات الإنسانية في SDC أو السفارة السويسرية في بلد عملكم.","⟦A⟧How to apply:⟦/A⟧ Send a concept note to the FCDO Occupied Palestinian Territories team; also bid through UN pooled funds the UK finances.":"⟦A⟧طريقة التقديم:⟦/A⟧ أرسلوا مذكرة مفاهيمية إلى فريق FCDO للأراضي الفلسطينية المحتلة؛ وقدّموا أيضًا عبر الصناديق الأممية المشتركة التي تموّلها المملكة المتحدة.","⟦A⟧How to apply:⟦/A⟧ Submit an expression of interest via the Medicor Foundation website (find it from this listing); new partners usually start with a one-year trial grant.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا إبداء اهتمام عبر موقع مؤسسة Medicor (تجدونه من هذه القائمة)؛ يبدأ الشركاء الجدد عادة بمنحة تجريبية لسنة واحدة.","⟦A⟧How to apply:⟦/A⟧ Submit on the EU Funding & Tenders Portal (PROSPECT); register a PIC number first.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا على بوابة التمويل والمناقصات الأوروبية (PROSPECT)؛ سجّلوا رقم PIC أولًا.","⟦A⟧How to apply:⟦/A⟧ Submit on the EU Funding & Tenders Portal as part of a consortium; you need an EU PIC number.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا على بوابة التمويل والمناقصات الأوروبية ضمن ائتلاف؛ تحتاجون رقم PIC أوروبيًا.","⟦A⟧How to apply:⟦/A⟧ Submit on the Laerdal application platform by {d}il or {d}ober.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا على منصة طلبات Laerdal قبل {d}il أو {d}ober.","⟦A⟧How to apply:⟦/A⟧ Submit the application form, {n} supplier quotes and audit quotes by email to the GGP section (ggp@bt.mofa.go.jp) during the annual call.":"⟦A⟧طريقة التقديم:⟦/A⟧ قدّموا نموذج الطلب و{n} عروض أسعار من الموردين وعروض التدقيق بالبريد إلى قسم GGP (ggp@bt.mofa.go.jp) خلال الدعوة السنوية.","⟦A⟧How to apply:⟦/A⟧ Through a German partner NGO.":"⟦A⟧طريقة التقديم:⟦/A⟧ عبر منظمة ألمانية شريكة.","⟦A⟧How to apply:⟦/A⟧ UN Partner Portal + OCHA GMS registration and capacity assessment; apply to standard allocations through the clusters.":"⟦A⟧طريقة التقديم:⟦/A⟧ التسجيل في بوابة شركاء الأمم المتحدة ونظام GMS التابع لـOCHA وتقييم القدرات؛ والتقديم للمخصصات العادية عبر المجموعات القطاعية.","⟦A⟧How to apply:⟦/A⟧ UN Partner Portal + OCHA GMS registration, capacity assessment, then apply to allocations via the health cluster.":"⟦A⟧طريقة التقديم:⟦/A⟧ التسجيل في بوابة شركاء الأمم المتحدة ونظام GMS التابع لـOCHA، وتقييم القدرات، ثم التقديم للمخصصات عبر المجموعة الصحية.","⟦A⟧How to apply:⟦/A⟧ Use the embassy's application form and budget template during the annual call.":"⟦A⟧طريقة التقديم:⟦/A⟧ استخدموا نموذج الطلب وقالب الميزانية الخاصين بالسفارة خلال الدعوة السنوية.","⟦A⟧How to apply:⟦/A⟧ Watch for new calls; apply as a partnership with a UK health institution.":"⟦A⟧طريقة التقديم:⟦/A⟧ ترقبوا الدعوات الجديدة؛ وقدّموا بالشراكة مع مؤسسة صحية بريطانية.","⟦A⟧How to apply:⟦/A⟧ When calls reopen, submit in the DERF format within the call window (Danish organisations).":"⟦A⟧طريقة التقديم:⟦/A⟧ عند إعادة فتح الدعوات، قدّموا بصيغة DERF ضمن فترة الدعوة (للمنظمات الدنماركية).","⟦A⟧How to apply:⟦/A⟧ Write to the Trust using the contact details on its Charity Commission entry.":"⟦A⟧طريقة التقديم:⟦/A⟧ راسلوا الصندوق عبر بيانات الاتصال في سجله لدى هيئة الجمعيات الخيرية.","⟦A⟧How to apply:⟦/A⟧ Year-round application form (English).":"⟦A⟧طريقة التقديم:⟦/A⟧ نموذج طلب متاح طوال العام (بالإنجليزية).","⟦A⟧Join the health cluster⟦/A⟧ in each country you work in. Pooled-fund allocations are prioritised through the clusters.":"⟦A⟧انضموا إلى المجموعة الصحية⟦/A⟧ في كل بلد تعملون فيه. تُحدَّد أولويات مخصصات الصناديق المشتركة عبر المجموعات القطاعية.","⟦A⟧Lease first, buy later.⟦/A⟧ Because stays are temporary, leasing and renovating near the hospitals is faster and lower-risk. If a donor wants a permanent building, set it up as an ⟦B⟧asset Waqf⟦/B⟧ with a deed that says how it will be used if the corridor ends (for example, for patients from Iraq, Syria, Yemen or Sudan treated in Amman).":"⟦A⟧استأجروا أولًا واشتروا لاحقًا.⟦/A⟧ لأن الإقامات مؤقتة، فالاستئجار والتجديد قرب المستشفيات أسرع وأقل مخاطرة. وإن أراد متبرع مبنى دائمًا، فاجعلوه ⟦B⟧وقفًا عقاريًا⟦/B⟧ بوثيقة تحدد استخدامه إذا انتهى الممر (مثلًا لمرضى من العراق أو سوريا أو اليمن أو السودان يُعالجون في عمّان).","⟦A⟧Local partners:⟦/A⟧ many calls (Australia DAP, Canada CFLI, Japan GGP, WPHF) are for locally registered organisations, so register in-country or co-apply with a local partner.":"⟦A⟧الشركاء المحليون:⟦/A⟧ كثير من الدعوات (DAP الأسترالية، CFLI الكندية، GGP اليابانية، WPHF) مخصصة للمنظمات المسجلة محليًا، فسجّلوا في البلد أو تقدّموا بالاشتراك مع شريك محلي.","⟦A⟧Need names?⟦/A⟧ See ⟦B⟧🔭 Donor prospects⟦/B⟧. ⟦C⟧Good practice:⟦/C⟧ thank within {n} hours, send an impact update every quarter, record consent before emailing, and ask Zakat donors to say “Zakat” so it is ring-fenced. For gifts of {n}+ or from overseas, run your ⟦D⟧due-diligence checks⟦/D⟧ first.":"⟦A⟧تحتاجون أسماء؟⟦/A⟧ انظروا ⟦B⟧🔭 المانحون المحتملون⟦/B⟧. ⟦C⟧ممارسات جيدة:⟦/C⟧ اشكروا خلال {n} ساعة، وأرسلوا تحديثًا عن الأثر كل ربع سنة، وسجّلوا الموافقة قبل المراسلة، واطلبوا من متبرعي الزكاة ذكر كلمة «زكاة» لتُفصل. للتبرعات بقيمة {n}+ أو من الخارج، أجروا ⟦D⟧فحوصات العناية الواجبة⟦/D⟧ أولًا.","⟦A⟧Next {n} months:⟦/A⟧ complete core policies and documents (safeguarding, anti-fraud, sanctions checks, finance). ⟦B⟧Organisation & documents →⟦/B⟧ · ⟦C⟧Compliance →⟦/C⟧":"⟦A⟧خلال الـ{n} أشهر القادمة:⟦/A⟧ أكملوا السياسات والوثائق الأساسية (الحماية، مكافحة الاحتيال، فحص العقوبات، المالية). ⟦B⟧المنظمة والوثائق ←⟦/B⟧ · ⟦C⟧الامتثال ←⟦/C⟧","⟦A⟧Opens {d}⟦/A⟧closes {d}":"⟦A⟧تفتح {d}⟦/A⟧تُغلق {d}","⟦A⟧Paused⟦/A⟧funds allocated":"⟦A⟧متوقفة⟦/A⟧الأموال مخصصة","⟦A⟧Record:⟦/A⟧ Contributed function state(o){if(o.status==='closed')return'closed';if(o.status==='paused')return'paused';if(o.opens&&days(o.opens)>0)return'soon';if(o.deadline&&days(o.deadline)<0)return'closed';if(o.status==='rolling')return'rolling';if(o.deadline)return'open';if(o.status==='upcoming')return'expected';return'rolling'}
function badge(o){const s=state(o);
  if(s==='open'){const n=days(o.deadline);const c=n<=14?'red':n<=45?'amber':'green';return`<div class="dl ${c}"><b>${fmtD(o.deadline)}</b>${n===0?'closes today':n+' days left'}</div>`}
  if(s==='soon')return`<div class="dl blue"><b>Opens ${fmtS(o.opens)}</b>${o.deadline?'closes '+fmtS(o.deadline):''}</div>`;
  if(s==='rolling')return`<div class="dl green"><b>Rolling</b>${o.deadline?'until '+fmtS(o.deadline):'any time'}</div>`;
  if(s==='expected')return`<div class="dl blue"><b>Expected</b>next round</div>`;
  if(s==='paused')return`<div class="dl"><b>Paused</b>funds allocated</div>`;
  return`<div class="dl"><b>Closed</b>${o.deadline?fmtS(o.deadline):''}</div>`}

// ================= timeline =================
function events(horizon){const ev=[];
  S.apps.forEach(a=>{if(ACTIVE.includes(a.stage)){(a.milestones||[]).filter(m=>!m.done).forEach(m=>ev.push({date:m.date,what:m.name,app:a,kind:'Milestone'}));if(a.deadline)ev.push({date:a.deadline,what:'DEADLINE',app:a,kind:'Deadline'})}
   (a.reports||[]).filter(r=>!r.done&&r.due).forEach(r=>ev.push({date:r.due,what:r.type,app:a,kind:'Report'}))});
  S.funders.filter(f=>f.nextDate&&!/Committed|Declined/.test(f.stage)).forEach(f=>ev.push({date:f.nextDate,what:f.next||'Follow up',app:{id:'',title:f.name},funder:f,kind:'Funder'}));
  return ev.filter(e=>!horizon||days(e.date)<=horizon).sort((x,y)=>x.date.localeCompare(y.date))}
function gantt(){const apps=S.apps.filter(a=>ACTIVE.includes(a.stage)||(a.stage==='Awarded'&&(a.reports||[]).some(r=>!r.done)));
  if(!apps.length)return`<div class="empty">Nothing on the timeline yet. Start an application from <a href="#" data-act="go" data-v="grants">Find grants</a>.</div>`;
  const start=addDays(todayISO,-7);const allD=apps.flatMap(a=>[a.deadline,...(a.milestones||[]).map(m=>m.date),...(a.reports||[]).map(r=>r.due)]).filter(Boolean);
  let end=allD.sort().pop();if(!end||days(end)<60)end=addDays(todayISO,60);if(days(end)>270)end=addDays(todayISO,270);
  const span=(new Date(end)-new Date(start))/864e5,L=230,W=1000,RH=34,top=30,H=top+apps.length*RH+10;
  const x=d=>L+Math.max(0,Math.min(1,((new Date(d)-new Date(start))/864e5)/span))*(W-L-10);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Application timeline">`;
  for(let d=new Date(start);d<=new Date(end);d.setDate(d.getDate()+1)){if(d.getDate()===1){const X=x(iso(d));s+=`<line x1="${X}" x2="${X}" y1="${top-6}" y2="${H}" stroke="#e3e8e6"/><text x="${X+3}" y="${top-10}" font-size="11" fill="#7a8886">${d.toLocaleDateString(undefined,{month:'short',year:'2-digit'})}</text>`}}
  apps.forEach((a,i)=>{const y=top+i*RH+RH/2;const ms=a.milestones||[];const st=ms.map(m=>m.date).sort()[0]||a.created||todayISO;
   s+=`<text x="4" y="${y+4}" font-size="12" fill="#14211f">${esc(a.title.length>32?a.title.slice(0,31)+'…':a.title)}</text>`;
   if(ACTIVE.includes(a.stage)&&a.deadline){s+=`<rect x="${x(st)}" y="${y-5}" width="${Math.max(2,x(a.deadline)-x(st))}" height="10" rx="5" fill="#cfe7e4"/>`;
    ms.forEach(m=>{s+=`<circle cx="${x(m.date)}" cy="${y}" r="5" fill="${m.done?'#2f5f99':m.date<todayISO?'#c9372c':'#fff'}" stroke="#2f5f99" stroke-width="1.5"><title>${esc(m.name)} · ${fmtD(m.date)}${m.done?' ✓':''}</title></circle>`});
    s+=`<path d="M${x(a.deadline)} ${y-8} l7 8 l-7 8 l-7 -8z" fill="#c9372c"><title>Deadline ${fmtD(a.deadline)}</title></path>`}
   (a.reports||[]).filter(r=>r.due).forEach(r=>{s+=`<rect x="${x(r.due)-5}" y="${y-5}" width="10" height="10" fill="${r.done?'#2f5f99':'#2b5fa8'}" transform="rotate(45 ${x(r.due)} ${y})"><title>${esc(r.type)} · ${fmtD(r.due)}</title></rect>`})});
  const T=x(todayISO);s+=`<line x1="${T}" x2="${T}" y1="${top-6}" y2="${H}" stroke="#c9372c" stroke-dasharray="3 3"/><text x="${T+3}" y="${H-2}" font-size="10.5" fill="#c9372c">today</text></svg>`;
  return`<div class="card gantt">${s}<div class="note" style="margin-top:6px">● milestone (filled = done, red = overdue) · ◆ red = submission deadline · ◆ blue = report due</div></div>`}
function agenda(ev){return ev.length?`<div class="agenda">${ev.map(e=>{const n=days(e.date);return`<div class="row"><b style="color:${n<0?'var(--red)':n<=7?'var(--amber)':'inherit'}">${fmtS(e.date)}</b><div>${e.kind==='Deadline'?'<span class="tag r">Deadline</span>':e.kind==='Report'?'<span class="tag b">Report</span>':e.kind==='Funder'?'<span class="tag g">Funder</span>':''}${esc(e.what)}<div class="note" style="margin:0">${esc(e.app.title)}</div></div>${e.funder?`<button class="btn sm" data-act="editFunder" data-id="${e.funder.id}">Open</button>`:`<button class="btn sm" data-act="openApp" data-id="${e.app.id}">Open</button>`}</div>`}).join('')}</div>`:'<p class="note">Nothing due.</p>'}
function vTimeline(){return`<div class="head"><div><h2>Timeline</h2><p>All active applications and reporting deadlines on one calendar.</p></div></div>${gantt()}
  <div class="card" style="margin-top:14px"><h3>Next 60 days</h3>${agenda(events(60))}</div>`}

async function crmSaveRec(r){const id=r.id||'c'+uid();r.id=id;r.updated=todayISO;await put('crm',id,r);

function remindersAll(){const out=[],in14=new Date(Date.now()+14*864e5).toISOString().slice(0,10),ago90=new Date(Date.now()-90*864e5).toISOString().slice(0,10);
  S.crm.filter(r=>['donor','sponsor','supplier'].includes(r.kind)).forEach(r=>{if(r.nextDate&&r.nextDate<=in14&&!/Declined|Not eligible/.test(r.stage))out.push({date:r.nextDate,r,what:r.next||'Follow up'})});
  crmL('donor').forEach(r=>{if((+r.received||0)>0&&!r.thanked)out.push({date:todayISO,r,what:'Send a thank-you (gift received)',tag:'Thank-you'});
   if(['Pledged','Received','Stewarding'].includes(r.stage)&&(!r.lastUpdate||r.lastUpdate<ago90))out.push({date:todayISO,r,what:'Send an impact update (none in 90 days)',tag:'Update'})});
  crmL('sponsor').forEach(r=>{if(['Agreed','Invoiced','Paid'].includes(r.stage)&&r.delivered!=='All delivered')out.push({date:todayISO,r,what:'Deliver the sponsor benefits you promised',tag:'Benefits'})});
  crmL('event').forEach(r=>{if(r.date&&r.date>=todayISO&&r.date<=in14)out.push({date:r.date,r,what:'Event day: '+r.name,tag:'Event'})});

function jhCalc(){const J={...JH_DEF,...(S.settings.jhome||{})},n=k=>+J[k]||0,rooms=n('rooms'),occ=Math.min(100,n('occ'))/100;
  const setup=n('renov')+n('furnish')*rooms+n('shared')+(J.model==='buy'?n('purchase'):0);
  const famCost=n('famMonth')*rooms*occ*12;
  const running=(J.model==='lease'?n('lease'):0)+n('staff')+famCost;
  const nights=rooms*occ*365,families=n('stay')?Math.round(nights/n('stay')):0;
  return{J,rooms,setup,running,total:setup+running,perNight:nights?running/nights:0,families,famCost}}
function jhMoney(v,J){return money(Math.round(v),J.cur)}

  <div class="card" style="background:#fffaf0;border-color:#f3d39a"><h3>Why this is needed</h3><ul style="margin:6px 0 0 18px;line-height:1.7;font-size:13.5px">

   <li>By late April 2026, 2,422 people had been evacuated: 716 patients and 1,706 family companions. The 35th group arrived on 20 Oct 2026. <a href="https://www.jordannews.jo/Section-109/News/Jordanian-Armed-Forces-evacuate-35th-group-of-sick-children-from-Gaza-for-treatment-57665" target="_blank" rel="noopener">Jordan News</a></li>
   <li>Hundreds of evacuees and their families are living in three Amman hotels while treated for cancer, trauma injuries and other conditions. <a href="https://www.anera.org/blog/healing-for-gazas-evacuated-families-in-jordan/" target="_blank" rel="noopener">Anera</a></li>
   <li>Jordan's policy is that patients and companions return to Gaza after treatment, so stays are temporary and new families keep arriving. <a href="https://petra.gov.jo/index.php/en/news/gaza-patients-return-home-after-completing-treatment-in-jordan" target="_blank" rel="noopener">Petra</a></li></ul></div>

function finCalc(){const F=S.settings.fin||{},cash=+F.cash||0,mon=+F.monthly||0,tgt=+F.target||6,icr=+F.icr||7,lines=F.lines||[];

  const top=Object.entries(byF).sort((a,b)=>b[1]-a[1])[0];const allF=Object.values(byF).reduce((a,b)=>a+b,0);
  const byT={};aw.forEach(a=>{byT['Institutional grants']=(byT['Institutional grants']||0)+gbp(a.awarded||a.amount,a.currency)});lines.forEach(l=>{byT[l.type]=(byT[l.type]||0)+(+l.amount||0)});

  if(d.cr){if(d.cr==='rule'){sub.cost.rule=+t.value;sub.cost.pct=COST_RULES[+t.value][1]}else sub.cost[d.cr]=+t.value||0;render();return}
  if(d.af){const a=findApp(detail);let v=t.value;const p={[d.af]:v};if(d.af==='stage'&&v==='Submitted'&&!a.submitted)p.submitted=todayISO;if(d.af==='stage'&&v==='Awarded'&&!a.decisionDate)p.decisionDate=todayISO;patchApp(a.id,p);if(['stage','deadline','title'].includes(d.af))render();return}
  if(d.pf){const a=findApp(detail);a.project={...(a.project||{}),[d.pf]:t.value};patchApp(a.id,{project:a.project});return}
  if(d.ms){const a=findApp(detail);const m=a.milestones.find(x=>x.id===d.ms);m[d.k]=t.type==='checkbox'?t.checked:t.value;patchApp(a.id,{milestones:a.milestones});if(d.k!=='owner'&&d.k!=='name')render();return}
  if(d.ck!==undefined){const a=findApp(detail);a.checklist[+d.ck].done=t.checked;patchApp(a.id,{checklist:a.checklist});return}
  if(d.rp!==undefined){const a=findApp(detail);a.reports[+d.rp][d.k]=t.type==='checkbox'?t.checked:t.value;patchApp(a.id,{reports:a.reports});render();return}
  if(d.org){const o={...(S.settings.org||{}),[d.org]:t.value};put('settings','org',o).then(()=>toast('Saved'));S.settings.org=o;if(d.org==='name')render();return}
  if(d.doc){const cur={...(S.docs[d.doc]||{}),[d.k]:t.value};put('docs',d.doc,cur).then(()=>toast('Saved'));if(d.k!=='link')render();return}
  if(d.sup){const s=S.supplies.find(x=>x.id===d.sup);put('supplies',s.id,{...s,[d.k]:t.value,updated:todayISO}).then(()=>{toast('Saved');render()});return}
  if(d.ctask!==undefined){if(crmEdit&&crmEdit.tasks)crmEdit.tasks[+d.ctask].done=t.checked;return}
  if(d.cq){(sub['c_'+d.cq]||(sub['c_'+d.cq]={})).q=t.value;render();return}
  if(d.jh){const J={...(S.settings.jhome||{}),[d.jh]:t.tagName==='SELECT'?t.value:(+t.value||0)};S.settings.jhome=J;put('settings','jhome',J);render();return}
  if(d.isl!==undefined){const c={...(S.settings.islamic||{}),[d.isl]:t.checked};S.settings.islamic=c;put('settings','islamic',c);render();return}
  if(d.supck!==undefined){const c={...(S.settings.supcheck||{}),[d.supck]:t.checked};S.settings.supcheck=c;put('settings','supcheck',c);return}
});

{const h=(location.hash||'').slice(1);if(VIEWS.some(v=>v[0]===h))view=h}
applyLang();i18nObs.observe(document.body,{childList:true,subtree:true});loadLocal();render();trNode(document.body);$('#sync').textContent='Offline: changes saved in this browser only';
(async()=>{try{const c=window.claude;if(!c||!c.use)return;
  db=await c.use('db');
  try{sample=await c.use('sample')}catch(e){sample=null}
  try{dls=await c.use('downloads')}catch(e){dls=null}
  if(!db){$('#sync').textContent='Sign in on claude.ai to share data with your team';render();return}
  S.apps=[];S.docs={};S.supplies=[];S.settings={};S.opps=[];S.funders=[];S.crm=[];
  const sub1=(col,fn)=>db.collection(col).onSnapshot(s=>{fn(s);$('#sync').textContent='● Live: shared with your team';softRender()},()=>{$('#sync').textContent='Connection problem: retrying'});
  sub1('opps',s=>{S.opps=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub1('apps',s=>{S.apps=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data())),...(PEND[d.id]||{})}))});
  sub1('docs',s=>{S.docs={};s.docs.forEach(d=>S.docs[d.id]=d.data())});
  sub1('funders',s=>{S.funders=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub1('supplies',s=>{S.supplies=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub1('crm',s=>{S.crm=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub1('settings',s=>{S.settings={};s.docs.forEach(d=>S.settings[d.id]=d.data())});
  sub1('i18n',s=>{const o={};s.docs.forEach(d=>{const x=d.data();if(x&&x.en&&x.ar)o[x.en]=x.ar});AR_DB=o;if(LANG==='ar')trNode(document.body)});
  render();
}catch(e){$('#sync').textContent='Offline: changes saved in this browser only'}})();
